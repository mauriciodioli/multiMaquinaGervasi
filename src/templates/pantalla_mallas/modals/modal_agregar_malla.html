<!-- Modal Agregar Malla -->
<div class="modal fade" id="modal-agregar-malla" tabindex="-1" aria-labelledby="modalAgregarMallaLabel" aria-hidden="true">
  <div class="modal-dialog">
    <form id="form-agregar-malla">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">➕ Aggiungi Malla</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Chiudi"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label for="nombre_comercial" class="form-label">Trade Name</label>
            <input type="text" class="form-control" id="nombre_comercial" name="nombre_comercial" required>
          </div>
          <div class="mb-3">
            <label for="diametro_mm" class="form-label">Diámetro (mm)</label>
            <input type="number" step="0.01" class="form-control" id="diametro_mm" name="diametro_mm" required>
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-primary">Mantenere</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelare</button>
        </div>
      </div>
    </form>
  </div>
</div>
