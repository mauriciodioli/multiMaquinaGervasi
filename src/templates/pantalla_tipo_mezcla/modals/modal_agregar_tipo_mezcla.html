<!-- Modal Agregar/Modificar Tipo de Mezcla -->
<div class="modal fade" id="modal-agregar-tipo-mezcla" tabindex="-1" aria-labelledby="modalTipoMezclaLabel" aria-hidden="true">
  <div class="modal-dialog">
    <form id="form-agregar-tipo-mezcla">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalTipoMezclaLabel">➕ {{ t_menu["agregar"] }} {{ t_menu["tipo_mezcla"] }}</h5>
          <button type="button" class="btn-close" onclick="cerrarModalAgregarTipoMezcla()" aria-label="{{ t_menu['cerrar'] }}"></button>
        </div>

        <div class="modal-body">
          <div class="mb-3">
            <label for="nombre" class="form-label">{{ t_menu["nombre"] }}</label>
            <input type="text" class="form-control" id="nombre" name="nombre" required>
          </div>
          <div class="mb-3">
            <label for="descripcion" class="form-label">{{ t_menu["descripcion"] }}</label>
            <textarea class="form-control" id="descripcion" name="descripcion" rows="2"></textarea>
          </div>
        </div>

        <div class="modal-footer">
          <button type="submit" class="btn btn-primary">{{ t_menu["guardar_cambios"] }}</button>
          <button type="button" class="btn btn-secondary" onclick="cerrarModalAgregarTipoMezcla()">{{ t_menu["cerrar"] }}</button>
        </div>
      </div>
    </form>
  </div>
</div>
