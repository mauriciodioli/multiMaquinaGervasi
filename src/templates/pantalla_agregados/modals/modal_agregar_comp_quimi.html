<div class="modal fade" id="modalAgregarComponente" tabindex="-1" aria-labelledby="modalComponenteLabel" aria-hidden="true">
  <div class="modal-dialog">
    <form method="post" action="{{ url_for('crud_agregado.agregar_componente_agregado', agregado_id=agregado.id) }}">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalComponenteLabel">Agregar componente químico</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>

        <div class="modal-body">
          <div class="mb-3">
            <label for="componente_id" class="form-label">Seleccionar componente:</label>
             <select class="form-select" id="componente_id" name="componente_id" required>
                <option value="">Seleccioná un componente</option>
                {% for comp in componentes_disponibles %}
                    <option value="{{ comp.id }}">{{ comp.nombre }}</option>
                {% endfor %}
            </select>

          </div>

          <div class="mb-3">
            <label for="porcentaje" class="form-label">Porcentaje (%):</label>
            <input type="number" step="0.01" min="0" max="100" class="form-control" name="porcentaje" id="porcentaje" required>
          </div>

          <div class="mb-3">
            <label for="orden" class="form-label">Orden:</label>
            <input type="number" class="form-control" name="orden" id="orden" required>
          </div>
        </div>

        <div class="modal-footer">
          <button type="submit" class="btn btn-primary">Agregar</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        </div>
      </div>
    </form>
  </div>
</div>
