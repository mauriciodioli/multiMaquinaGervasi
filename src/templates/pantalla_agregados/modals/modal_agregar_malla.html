<style>
  .modal-body select.form-select {
    margin-bottom: 1.5rem !important;
  }
</style>

<div class="modal fade" id="modalAgregarMalla" tabindex="-1" aria-labelledby="modalMallaLabel" aria-hidden="true">
  <div class="modal-dialog">
    <form method="post" action="{{ url_for('crud_agregado.mixFamiliari_crud_agregado_agregados_mallas', agregado_id=agregado.id) }}">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalMallaLabel">➕ {{ t_menu["agregar"] }} {{ t_menu["malla"] }} {{ t_menu["al_agregado"] }}</h5>
          <button type="button" class="btn-close" onclick="cerrarmodalAgregarMalla()" aria-label="{{ t_menu['cerrar'] }}"></button>
        </div>

        <div class="modal-body">
          <div class="mb-3">
            <label for="malla_id" class="form-label">{{ t_menu["seleccionar_malla"] }}</label>
            <select class="form-select" id="malla_id" name="malla_id" required>
              <option value="">{{ t_menu["elegir_malla"] }}</option>
              {% for malla in mallas_disponibles %}
                <option value="{{ malla.id }}">{{ malla.nombre_comercial }} ({{ malla.diametro_mm }} mm)</option>
              {% endfor %}
            </select>
          </div>
        </div>

        <div class="modal-footer">
          <button type="submit" class="btn btn-primary">{{ t_menu["agregar"] }}</button>
          <button type="button" class="btn btn-secondary" onclick="cerrarmodalAgregarMalla()">{{ t_menu["cerrar"] }}</button>
        </div>
      </div>
    </form>
  </div>
</div>
