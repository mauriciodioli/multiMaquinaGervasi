<div class="modal fade" id="modal-agregar-mix" tabindex="-1" aria-labelledby="modalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalLabel">{{ t_menu["agregar_agregado"] }}</h5>
        <button type="button" class="btn-close" onclick="cerrarModalagregarMix()" aria-label="{{ t_menu['cerrar'] }}"></button>
      </div>
      <form id="form-agregar-mix">
        <div class="modal-body">
          <div class="mb-3">
            <label for="nome" class="form-label">{{ t_menu["nombre"] }}</label>
            <input type="text" class="form-control" name="nome" id="nome" required>
          </div>
          <div class="mb-3">
            <label for="descrizione" class="form-label">{{ t_menu["descripcion"] }}</label>
            <input type="text" class="form-control" name="descrizione" id="descrizione">
          </div>
          <div class="mb-3">
            <label for="select-estado" class="form-label">{{ t_menu["estado"] }}</label>
            <select class="form-select" name="estado" id="select-estado" required>
              <option value="">{{ t_menu["seleccionar_estado"] }}</option>
              <option value="Attivo">✅ {{ t_menu["activo"] }}</option>
              <option value="Inattivo">⛔ {{ t_menu["inactivo"] }}</option>
            </select>
          </div>
        </div>
         <div class="modal-footer" style="margin-top: 2em;">
          <button type="submit" class="btn btn-success" id="btn-confirmar-aggiungi-agregado">{{ t_menu["agregar"] }}</button>
          <button type="button" id="btn-cancelar-modificar" class="btn btn-secondary" onclick="cerrarModalagregarMix()">{{ t_menu["cerrar"] }}</button>
        </div>
      </form>
    </div>
  </div>
</div>
