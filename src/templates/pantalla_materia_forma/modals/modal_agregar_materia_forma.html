<!-- Modal Agregar Materia/Forma -->
<div class="modal fade" id="modal-agregar-materia-forma" tabindex="-1" aria-labelledby="modalMateriaFormaAgregarLabel" aria-hidden="true">
  <div class="modal-dialog">
    <form id="form-agregar-materia-forma">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalMateriaFormaAgregarLabel">
            ➕ {{ t_menu["agregar"] }} {{ t_menu["materia_forma"] }}
          </h5>
          <button type="button" class="btn-close" onclick="cerrarModalAgregarMateriaForma()" aria-label="{{ t_menu['cerrar'] }}"></button>
        </div>
        <div class="modal-body">

          <div class="mb-3">
            <label for="add-origen" class="form-label">{{ t_menu["origen"] }}</label>
            <input type="text" class="form-control" id="add-origen" name="origen" required>
          </div>

          <div class="mb-3">
            <label for="add-forma" class="form-label">{{ t_menu["forma"] }}</label>
            <input type="text" class="form-control" id="add-forma" name="forma">
          </div>

          <div class="mb-3">
            <label for="add-descripcion" class="form-label">{{ t_menu["descripcion"] }}</label>
            <textarea class="form-control" id="add-descripcion" name="descripcion" rows="2"></textarea>
          </div>

          <!-- Estado en fila tipo tabla -->
          <div class="mb-3 row align-items-center">
            <label class="col-sm-4 col-form-label">{{ t_menu["estado"] }}</label>
            <div class="col-sm-8">
              <div class="form-check">
                <input type="checkbox" class="form-check-input" id="add-estado" name="estado" checked>
               
              </div>
            </div>
          </div>

        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-primary">{{ t_menu["guardar"] }}</button>
          <button type="button" class="btn btn-secondary" onclick="cerrarModalAgregarMateriaForma()">
            {{ t_menu["cerrar"] }}
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
