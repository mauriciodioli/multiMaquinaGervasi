<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auditoría de Mezcla Granulométrica</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='2' y='2' width='13' height='13' fill='%23C8102E' rx='1'/><rect x='17' y='2' width='13' height='13' fill='%23F5A800' rx='1'/><rect x='2' y='17' width='13' height='13' fill='%2300A550' rx='1'/><rect x='17' y='17' width='13' height='13' fill='%230057A8' rx='1'/></svg>">
    <script src="/static/js/i18n.js"></script>
    <script src="/static/js/dpia_i18n.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        

    header{background:var(--white);padding:.9rem 2rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.18);}
    .logo{display:flex;align-items:center;gap:.6rem;text-decoration:none;}
    .logo-text{font-family:var(--font-display);font-size:2rem;font-weight:900;color:var(--black);letter-spacing:-.03em;}
    .logo-icon{display:grid;grid-template-columns:1fr 1fr;gap:3px;width:28px;height:28px;}
    .logo-icon span{border-radius:2px;}
    .logo-icon span:nth-child(1){background:#C8102E;}
    .logo-icon span:nth-child(2){background:#F5A800;}
    .logo-icon span:nth-child(3){background:#00A550;}
    .logo-icon span:nth-child(4){background:#0057A8;}

       * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
        }
        
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            border-bottom: 3px solid #0066cc;
            padding-bottom: 15px;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .section {
            margin: 30px 0;
            padding: 20px;
            border-left: 4px solid #0066cc;
            background: #f9f9f9;
            border-radius: 4px;
        }
        
        .section h2 {
            color: #0066cc;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .section h2::before {
            content: '📊';
        }
        
        .criterio {
            margin: 15px 0;
            padding: 12px;
            background: white;
            border-radius: 4px;
            border-left: 3px solid #ddd;
        }
        
        .criterio.ok {
            border-left-color: #28a745;
            background: #f0fff4;
        }
        
        .criterio.warning {
            border-left-color: #ffc107;
            background: #fffbf0;
        }
        
        .criterio.error {
            border-left-color: #dc3545;
            background: #fff5f5;
        }
        
        .criterio label {
            font-weight: bold;
            color: #444;
            display: block;
            margin-bottom: 5px;
        }
        
        .criterio .value {
            font-size: 18px;
            color: #0066cc;
            font-weight: bold;
        }
        
        .decision-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            text-align: center;
        }
        
        .decision-box h3 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        
        .decision-box p {
            font-size: 16px;
            opacity: 0.9;
        }
        
        .semaforo {
            text-align: center;
            font-size: 48px;
            margin: 15px 0;
        }
        
        .tabla-receta {
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0;
        }
        
        .tabla-receta thead {
            background: #0066cc;
            color: white;
        }
        
        .tabla-receta th,
        .tabla-receta td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        
        .tabla-receta tbody tr:nth-child(even) {
            background: #f9f9f9;
        }
        
        .tabla-receta tbody tr:hover {
            background: #f0f0f0;
        }
        
        .grafico-container {
            position: relative;
            height: 400px;
            margin: 30px 0;
            background: white;
            padding: 20px;
            border-radius: 4px;
            border: 1px solid #eee;
        }
        
        .instruccion {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            padding: 15px;
            border-radius: 4px;
            margin: 15px 0;
            font-size: 15px;
            color: #444;
            line-height: 1.6;
        }
        
        .proporciones {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 15px 0;
        }
        
        .proporcion-item {
            background: white;
            border: 2px solid #0066cc;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }
        
        .proporcion-item .nombre {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
        }
        
        .proporcion-item .valor {
            font-size: 28px;
            font-weight: bold;
            color: #0066cc;
        }
        
        .mejora-item {
            display: inline-block;
            background: white;
            border: 1px solid #ddd;
            padding: 15px 20px;
            margin: 10px 10px 10px 0;
            border-radius: 4px;
            font-size: 14px;
        }
        
        .mejora-item .label {
            color: #666;
            display: block;
            font-size: 12px;
            margin-bottom: 5px;
        }
        
        .mejora-item .valor {
            font-size: 18px;
            font-weight: bold;
            color: #28a745;
        }
        
        .carga-datos {
            background: #f0f0f0;
            padding: 20px;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        
        .carga-datos input,
        .carga-datos button {
            padding: 10px 15px;
            margin: 5px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        
        .carga-datos button {
            background: #0066cc;
            color: white;
            cursor: pointer;
            border: none;
        }
        
        .carga-datos button:hover {
            background: #0052a3;
        }

        .report-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin: 0 0 18px;
            flex-wrap: wrap;
        }

        .report-actions button {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            background: #184e77;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .report-actions button:hover {
            background: #123a59;
        }

        .report-actions .report-hint {
            display: flex;
            align-items: center;
            color: #5b6670;
            font-size: 13px;
        }

        .pdf-print-title {
            display: none;
            margin: 0 0 22px;
            padding: 0 0 14px;
            border-bottom: 2px solid #d5dde5;
        }

        .pdf-print-title h2 {
            margin: 0;
            color: #123a59;
            font-size: 24px;
            line-height: 1.2;
        }

        .pdf-title-modal {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(15, 23, 42, 0.56);
            z-index: 1200;
            padding: 20px;
        }

        .pdf-title-modal.is-open {
            display: flex;
        }

        .pdf-title-dialog {
            width: min(100%, 460px);
            background: #ffffff;
            border-radius: 14px;
            box-shadow: 0 24px 70px rgba(15, 23, 42, 0.28);
            padding: 22px;
        }

        .pdf-title-dialog h3 {
            margin: 0 0 10px;
            color: #123a59;
            font-size: 20px;
        }

        .pdf-title-dialog p {
            margin: 0 0 14px;
            color: #516170;
            font-size: 14px;
            line-height: 1.5;
        }

        .pdf-title-dialog label {
            display: block;
            margin-bottom: 8px;
            color: #22313f;
            font-size: 14px;
            font-weight: 700;
        }

        .pdf-title-dialog input {
            width: 100%;
            border: 1px solid #c9d6e2;
            border-radius: 8px;
            padding: 12px 14px;
            font-size: 15px;
            color: #17212b;
        }

        .pdf-title-dialog input:focus {
            outline: 2px solid rgba(24, 78, 119, 0.18);
            border-color: #184e77;
        }

        .pdf-title-error {
            min-height: 20px;
            margin-top: 8px;
            color: #b42318;
            font-size: 13px;
        }

        .pdf-title-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 18px;
            flex-wrap: wrap;
        }

        .pdf-title-actions button {
            border: none;
            border-radius: 8px;
            padding: 10px 14px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
        }

        .pdf-title-actions .secondary {
            background: #e9eef3;
            color: #294255;
        }

        .pdf-title-actions .primary {
            background: #184e77;
            color: #ffffff;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .error-box {
            background: #fff5f5;
            border: 1px solid #fc8181;
            border-left: 4px solid #f56565;
            color: #c53030;
            padding: 15px;
            border-radius: 4px;
            margin: 15px 0;
        }

        .operator-panel {
            margin: 30px 0;
            padding: 24px;
            border-radius: 12px;
            background: linear-gradient(135deg, #f7fbff 0%, #eef6f1 100%);
            border: 1px solid #d8e8db;
        }

        .operator-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 18px;
        }

        .operator-title h2 {
            color: #184e77;
            margin: 0;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 140px;
            padding: 10px 14px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            background: #e7f6ea;
            color: #1f6f43;
        }

        .status-pill.warning {
            background: #fff4dd;
            color: #9a6700;
        }

        .status-pill.error {
            background: #fdeaea;
            color: #b42318;
        }

        .ops-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-top: 18px;
        }

        .ops-card {
            background: white;
            border: 1px solid #dce7ef;
            border-radius: 10px;
            padding: 16px;
        }

        .ops-card h3 {
            margin: 0 0 10px;
            color: #184e77;
            font-size: 15px;
        }

        .ops-main-value {
            font-size: 28px;
            font-weight: 700;
            color: #0f4c5c;
            margin-bottom: 8px;
        }

        .ops-card p,
        .ops-card li {
            color: #44515c;
            font-size: 14px;
            line-height: 1.5;
        }

        .ops-card ul {
            margin: 8px 0 0 18px;
        }

        .recipe-strip {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-top: 18px;
        }

        .recipe-item {
            background: white;
            border: 2px solid #d6e6f2;
            border-radius: 10px;
            padding: 14px;
        }

        .recipe-item .material {
            color: #4d5b67;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .recipe-item .percent {
            color: #184e77;
            font-size: 30px;
            font-weight: 800;
        }

        .detail-toggle {
            margin-top: 22px;
            border: 1px solid #d8dde3;
            border-radius: 10px;
            overflow: hidden;
            background: white;
        }

        .detail-toggle button {
            width: 100%;
            padding: 16px 18px;
            border: none;
            background: #f8fafc;
            text-align: left;
            cursor: pointer;
            font-weight: 700;
            color: #234;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .detail-body {
            display: none;
            padding: 0 18px 18px;
            background: #fff;
        }
        
        .success-box {
            background: #f0fff4;
            border: 1px solid #9ae6b4;
            border-left: 4px solid #38a169;
            color: #22543d;
            padding: 15px;
            border-radius: 4px;
            margin: 15px 0;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }

            .report-actions {
                justify-content: stretch;
            }

            .report-actions button,
            .report-actions .report-hint {
                width: 100%;
            }

            .pdf-title-actions button {
                width: 100%;
            }
            
            .proporciones {
                grid-template-columns: 1fr;
            }
            
            .grafico-container {
                height: 300px;
            }
        }

        @page {
            size: A4;
            margin: 12mm;
        }

        @media print {
            * {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            body {
                background: white;
                padding: 0;
            }

            .container {
                max-width: none;
                box-shadow: none;
                border-radius: 0;
                padding: 0;
            }

            .carga-datos,
            .report-actions,
            .detail-toggle button,
            .accordion-header,
            .pdf-title-modal {
                display: none !important;
            }

            .pdf-print-title {
                display: block !important;
            }

            .detail-body,
            .accordion-body {
                display: block !important;
                padding-top: 16px;
            }

            .operator-panel,
            .section,
            .ops-card,
            .recipe-item,
            .criterio,
            .grafico-container,
            .accordion-item,
            .detail-toggle,
            .tabla-receta {
                break-inside: avoid;
                page-break-inside: avoid;
            }

            .grafico-container,
            #graficoErrorTamiz,
            #graficoDesviacion {
                height: 280px !important;
                width: 100% !important;
                max-width: 100% !important;
                overflow: hidden !important;
            }

            .grafico-container canvas,
            #graficoErrorTamiz canvas,
            #graficoDesviacion canvas {
                width: 100% !important;
                max-width: 100% !important;
            }

            .grafico-print-snapshot {
                display: block !important;
                width: 100% !important;
                max-width: 100% !important;
                height: auto !important;
            }

            h1 {
                font-size: 20pt;
            }
        }
    </style>
</head>
<body>
    <header>
        <a href="/" class="logo">
            <div class="logo-icon">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
            </div>
            <span class="logo-text">Gervasi</span>
        </a>
    </header>
    
    <div class="container">
        <h1 data-i18n="auditoria.page_header">🔬 Auditoría de Mezcla Granulométrica</h1>
        <p class="subtitle" data-i18n="auditoria.page_subtitle">Evaluación de cumplimiento de banda y decisión de tabla virtual dirigida</p>
        
        <!-- Sección de carga de datos -->
        <div class="carga-datos">
            <h3 data-i18n="auditoria.load_section_title">Cargar datos desde archivo JSON o ingreso manual</h3>
            <textarea id="jsonInput" style="width:100%; height:100px; margin: 10px 0; padding: 10px; font-family: monospace; border: 1px solid #ddd; border-radius: 4px;" placeholder='{"pasante_real": [...], "banda_min": [...], "banda_max": [...], "tamices": [...]}'></textarea>
            <button onclick="cargarDatos()" data-i18n="auditoria.load_json_btn">📤 Cargar JSON</button>
            <button onclick="usarEjemplo()" data-i18n="auditoria.use_example_btn">📋 Usar ejemplo</button>
        </div>
        
        <!-- Resultado -->
        <div id="resultado"></div>
    </div>

    <div id="pdfTitleModal" class="pdf-title-modal" aria-hidden="true">
        <div class="pdf-title-dialog" role="dialog" aria-modal="true" aria-labelledby="pdfTitleModalHeading">
            <h3 id="pdfTitleModalHeading"></h3>
            <p id="pdfTitleModalDescription"></p>
            <label for="pdfTitleInput" id="pdfTitleModalLabel"></label>
            <input id="pdfTitleInput" type="text" maxlength="180">
            <div id="pdfTitleError" class="pdf-title-error" aria-live="polite"></div>
            <div class="pdf-title-actions">
                <button type="button" id="pdfTitleCancelBtn" class="secondary"></button>
                <button type="button" id="pdfTitleConfirmBtn" class="primary"></button>
            </div>
        </div>
    </div>
    
    <script>
        // ============ VARIABLES GLOBALES ============
        let instanciaChart = null; // Rastrear instancia de Chart.js para destruir antes de recrear
        let instanciaErrorChart = null; // Gráfico de error por tamiz
        let instanciaDesviacionChart = null; // Gráfico de desviación
        let snapshotGraficoComparacion = null;
        let ultimoTituloPDF = '';

        function tAuditoria(key, fallback = '') {
            if (typeof I18N !== 'undefined' && I18N && typeof I18N.t === 'function') {
                const value = I18N.t(`auditoria.${key}`);
                if (value && value !== `[auditoria.${key}]`) return value;
            }
            return fallback || key;
        }

        function fmtAuditoria(key, replacements = {}, fallback = '') {
            let text = tAuditoria(key, fallback);
            Object.entries(replacements).forEach(([name, value]) => {
                text = text.replaceAll(`{${name}}`, value);
            });
            return text;
        }

        function applyAuditoriaTranslations() {
            const lang = (typeof I18N !== 'undefined' && I18N && typeof I18N.getLang === 'function')
                ? I18N.getLang()
                : (localStorage.getItem('lang') || 'es');
            document.documentElement.lang = lang;
            document.title = tAuditoria('page_title', 'Auditoría de Mezcla Granulométrica');
            const input = document.getElementById('jsonInput');
            if (input) {
                input.placeholder = tAuditoria('json_placeholder', '{"pasante_real": [...], "banda_min": [...], "banda_max": [...], "tamices": [...]}');
            }
            if (typeof I18N !== 'undefined' && I18N && typeof I18N.applyTranslations === 'function') {
                I18N.applyTranslations(document);
            }
            actualizarTextosModalPDF();
        }

        function actualizarTextosModalPDF() {
            const heading = document.getElementById('pdfTitleModalHeading');
            const description = document.getElementById('pdfTitleModalDescription');
            const label = document.getElementById('pdfTitleModalLabel');
            const input = document.getElementById('pdfTitleInput');
            const cancelBtn = document.getElementById('pdfTitleCancelBtn');
            const confirmBtn = document.getElementById('pdfTitleConfirmBtn');

            if (heading) heading.textContent = tAuditoria('pdf_title_modal_title', 'Título del PDF');
            if (description) description.textContent = tAuditoria('pdf_title_modal_description', 'Ingresa el título que debe aparecer dentro del PDF impreso.');
            if (label) label.textContent = tAuditoria('pdf_title_modal_label', 'Título');
            if (input) input.placeholder = tAuditoria('pdf_title_modal_placeholder', 'Ej: Auditoría planta turno mañana');
            if (cancelBtn) cancelBtn.textContent = tAuditoria('pdf_title_modal_cancel', 'Cancelar');
            if (confirmBtn) confirmBtn.textContent = tAuditoria('pdf_title_modal_confirm', 'Generar PDF');
        }

        function obtenerModalPDF() {
            return {
                modal: document.getElementById('pdfTitleModal'),
                input: document.getElementById('pdfTitleInput'),
                error: document.getElementById('pdfTitleError')
            };
        }

        function abrirModalTituloPDF() {
            const { modal, input, error } = obtenerModalPDF();
            if (!modal || !input || !error) {
                return;
            }

            actualizarTextosModalPDF();
            error.textContent = '';
            input.value = ultimoTituloPDF || '';
            modal.classList.add('is-open');
            modal.setAttribute('aria-hidden', 'false');

            window.setTimeout(() => {
                input.focus();
                input.select();
            }, 0);
        }

        function cerrarModalTituloPDF() {
            const { modal, error } = obtenerModalPDF();
            if (!modal || !error) {
                return;
            }

            error.textContent = '';
            modal.classList.remove('is-open');
            modal.setAttribute('aria-hidden', 'true');
        }

        function asegurarNodoTituloPDF() {
            const resultado = document.getElementById('resultado');
            if (!resultado) {
                return null;
            }

            let wrapper = document.getElementById('pdfPrintTitle');
            if (!wrapper) {
                wrapper = document.createElement('div');
                wrapper.id = 'pdfPrintTitle';
                wrapper.className = 'pdf-print-title';
                wrapper.innerHTML = '<h2></h2>';
                resultado.prepend(wrapper);
            }

            return wrapper;
        }

        function actualizarTituloPDFParaImpresion(titulo) {
            const wrapper = asegurarNodoTituloPDF();
            if (!wrapper) {
                return;
            }

            const heading = wrapper.querySelector('h2');
            if (heading) {
                heading.textContent = titulo;
            }
        }

        function confirmarTituloPDFYExportar() {
            const { input, error } = obtenerModalPDF();
            if (!input || !error) {
                return;
            }

            const titulo = input.value.trim();
            if (!titulo) {
                error.textContent = tAuditoria('pdf_title_required', 'Ingresa un título para el PDF.');
                input.focus();
                return;
            }

            ultimoTituloPDF = titulo;
            cerrarModalTituloPDF();
            ejecutarExportacionPDFConTitulo(titulo);
        }

        function inicializarModalTituloPDF() {
            const modal = document.getElementById('pdfTitleModal');
            const input = document.getElementById('pdfTitleInput');
            const cancelBtn = document.getElementById('pdfTitleCancelBtn');
            const confirmBtn = document.getElementById('pdfTitleConfirmBtn');

            if (!modal || !input || !cancelBtn || !confirmBtn) {
                return;
            }

            cancelBtn.addEventListener('click', cerrarModalTituloPDF);
            confirmBtn.addEventListener('click', confirmarTituloPDFYExportar);

            modal.addEventListener('click', (event) => {
                if (event.target === modal) {
                    cerrarModalTituloPDF();
                }
            });

            input.addEventListener('keydown', (event) => {
                if (event.key === 'Enter') {

        // ============ FUNCIONES DE SOPORTE PARA CONVERSIÓN ============
        
        /**
         * Detecta si un array es retidos individuales (suma ≈ 100) o pasantes (decrece monotónicamente)
         * @param {number[]} valores - Array de porcentajes
         * @returns {string} 'retidos' | 'pasantes'
         */
        function detectarFormatoPortcentajes(valores) {
            if (!Array.isArray(valores) || valores.length < 2) return 'desconocido';
            
            const suma = valores.reduce((a, b) => a + b, 0);
            const esRetidos = Math.abs(suma - 100) < 5; // suma ≈ 100
            
            // Los pasantes SIEMPRE son decrecientes (monotónicamente)
            let esDecreciente = true;
            for (let i = 1; i < valores.length; i++) {
                if (valores[i] > valores[i-1]) {
                    esDecreciente = false;
                    break;
                }
            }
            
            if (esRetidos) {
                console.log(`🔍 Formato detectado: RETIDOS INDIVIDUALES (suma=${suma.toFixed(1)})`);
                return 'retidos';
            } else if (esDecreciente) {
                console.log(`🔍 Formato detectado: PASANTES ACUMULADOS (decrece monotónicamente)`);
                return 'pasantes';
            } else {
                console.warn(`⚠️ Formato AMBIGUO (suma=${suma.toFixed(1)}, decreciente=${esDecreciente})`);
                return 'ambiguo';
            }
        }
        
        /**
         * Convierte retidos individuales a pasantes acumulados
         * @param {number[]} retidos - Retidos individuales: [r1, r2, r3, ...]
         * @returns {number[]} Pasantes acumulados (empezando desde 100)
         */
        function retidosAPassantes(retidos) {
            let acumulado = 0;
            const pasantes = retidos.map((valor) => {
                acumulado += Number(valor || 0);
                return Math.max(0, 100 - acumulado);
            });
            
            console.log(`✅ Conversión retidos→pasantes:`, {
                retidos_entrada: retidos.map(r => r.toFixed(2)),
                pasantes_salida: pasantes.map(p => p.toFixed(2))
            });
            
            return pasantes;
        }

        function pasantesARetidos(pasantes) {
            const retidos = [];

            for (let i = 0; i < pasantes.length - 1; i++) {
                retidos[i] = pasantes[i] - pasantes[i + 1];
            }
            retidos[pasantes.length - 1] = pasantes[pasantes.length - 1];

            return retidos;
        }

        function normalizarTamizValor(valor) {
            const numero = Number.parseFloat(valor);
            return Number.isFinite(numero) ? numero : null;
        }

        function construirEjeComunTamices(tablas) {
            const tamicesUnicos = new Set();

            tablas.forEach((tabla) => {
                (tabla.filas || []).forEach((fila) => {
                    const tamiz = normalizarTamizValor(fila.tamiz);
                    if (tamiz !== null) {
                        tamicesUnicos.add(tamiz);
                    }
                });
            });

            return Array.from(tamicesUnicos).sort((a, b) => b - a);
        }

        function alinearFilasATamices(tabla, tamices) {
            const filasMapeadas = new Map();

            (tabla.filas || []).forEach((fila) => {
                const tamiz = normalizarTamizValor(fila.tamiz);
                if (tamiz === null) return;
                filasMapeadas.set(tamiz, Number.parseFloat(fila.porcentaje) || 0);
            });

            return tamices.map((tamiz) => filasMapeadas.get(tamiz) ?? 0);
        }
        
        /**
         * Construye curva inicial desde datos crudos y conserva materiales para optimización
         * @param {Array} tablas - Array de {nombre, filas: [{tamiz, porcentaje}]}
         * @returns {Object} {pasante_real, tamices, nombre, materiales: [{nombre, pasantes}, ...]}
         */
        function construirMezclaDesdeMultiples(tablas) {
            if (!Array.isArray(tablas) || tablas.length === 0) return null;
            
            console.log(`📊 Construyendo curva inicial cruda de ${tablas.length} materiales...`);
            
            // Construir eje común de tamices para tolerar tablas con distinta cantidad de filas.
            const tamices = construirEjeComunTamices(tablas);
            console.log(`   Tamices: [${tamices.join(', ')}]`);

            const pesosDeclarados = tablas.map((tabla) => {
                if (typeof tabla.proporcion_pct === 'number' && Number.isFinite(tabla.proporcion_pct)) {
                    return Math.max(0, Number(tabla.proporcion_pct));
                }
                if (typeof tabla.peso === 'number' && Number.isFinite(tabla.peso)) {
                    return Math.max(0, Number(tabla.peso) * 100);
                }
                return null;
            });

            const todosLosPesosDeclarados = pesosDeclarados.every((peso) => typeof peso === 'number');
            const sumaPesosDeclarados = todosLosPesosDeclarados
                ? pesosDeclarados.reduce((acumulado, peso) => acumulado + peso, 0)
                : 0;

            const pesosNormalizados = todosLosPesosDeclarados && sumaPesosDeclarados > 0
                ? pesosDeclarados.map((peso) => peso / sumaPesosDeclarados)
                : tablas.map(() => 1 / tablas.length);

            console.log(`   Pesos usados para auditoría: [${pesosNormalizados.map((peso) => (peso * 100).toFixed(2)).join(', ')}]%`);
            
            // PASO 1: Procesar cada material y reconstruir la resultante cruda
            const materialesProcesados = [];
            const retidosCrudosResultantes = new Array(tamices.length).fill(0);
            tablas.forEach((tabla, idx) => {
                const valores = alinearFilasATamices(tabla, tamices);
                const formato = detectarFormatoPortcentajes(valores);
                const pesoNormalizado = pesosNormalizados[idx] || 0;
                const proporcionPct = pesoNormalizado * 100;
                
                console.log(`   Material ${idx+1} (${tabla.nombre}): formato=${formato}, suma=${valores.reduce((a, b) => a + b, 0).toFixed(1)}%`);
                
                let retidos = valores;
                
                // Si detectó pasantes, revertir a retidos
                if (formato === 'pasantes') {
                    console.log(`     → Revirtiendo pasantes a retidos`);
                    retidos = pasantesARetidos(valores);
                }
                
                // Mantener materiales normalizados para la optimización posterior
                const sumaRetidos = retidos.reduce((a, b) => a + b, 0);
                const retidosNormalizados = sumaRetidos > 0
                    ? retidos.map(r => (r / sumaRetidos) * 100)
                    : retidos.map(() => 0);
                console.log(`     Retidos normalizados (suma=${sumaRetidos.toFixed(1)}%): [${retidosNormalizados.map(r => r.toFixed(2)).join(', ')}]`);

                for (let i = 0; i < retidosNormalizados.length; i++) {
                    retidosCrudosResultantes[i] += (retidosNormalizados[i] || 0) * pesoNormalizado;
                }
                
                // Convertir retidos normalizados a pasantes
                const pasantes = retidosAPassantes(retidosNormalizados);
                console.log(`     Pasantes: [${pasantes.map(p => p.toFixed(1)).join(', ')}]`);
                
                materialesProcesados.push({
                    nombre: tabla.nombre,
                    pasantes: pasantes,
                    retido_ind_pct: retidosNormalizados,
                    peso: pesoNormalizado,
                    proporcion_pct: proporcionPct
                });
            });

            const retidosResultantesNormalizados = retidosCrudosResultantes.map((valor) => Number(valor || 0));
            const pasantesCrudosResultantes = retidosAPassantes(retidosResultantesNormalizados);

            console.log(`   Retidos crudos resultantes: [${retidosCrudosResultantes.map(r => r.toFixed(1)).join(', ')}]`);
            console.log(`   Resultante cruda normalizada localStorage: [${pasantesCrudosResultantes.map(p => p.toFixed(1)).join(', ')}]`);
            
            // Intentar recuperar limites del localStorage si existen
            let limite_min = [];
            let limite_max = [];
            const limitesGuardados = localStorage.getItem('limitesGranulometria');
            if (limitesGuardados) {
                try {
                    const limites = JSON.parse(limitesGuardados);
                    limite_min = limites.banda_min || [];
                    limite_max = limites.banda_max || [];
                } catch (e) {
                    console.warn('Error al cargar límites guardados:', e);
                }
            }
            
            return {
                pasante_real: pasantesCrudosResultantes,
                tamices: tamices,
                nombre: `Mezcla ${tablas.map(t => t.nombre).join(' + ')}`,
                materiales: materialesProcesados,  // ← NUEVO: retornar materiales originales
                banda_min: limite_min.length === tamices.length ? limite_min : [],
                banda_max: limite_max.length === tamices.length ? limite_max : []
            };
        }
        
        // ============ FUNCIÓN PRINCIPAL: CARGAR DESDE STORAGE ============
        
        // Cargar datos desde localStorage.tablasCargadas y convertir a formato de auditoría
        function cargarDatosDelStorage() {
            // Primero intentar cargar desde sessionStorage (vienen del modal)
            const datosSession = sessionStorage.getItem('datosAuditoriaRecientes');
            if (datosSession) {
                try {
                    const payloadSession = JSON.parse(datosSession);
                    const entrada = payloadSession && payloadSession.entrada;

                    sessionStorage.removeItem('datosAuditoriaRecientes');

                    if (
                        entrada
                        && Array.isArray(entrada.pasante_real)
                        && Array.isArray(entrada.tamices)
                        && entrada.pasante_real.length > 0
                        && entrada.tamices.length > 0
                    ) {
                        console.log('✅ Entrada encontrada en sessionStorage; se recalculará auditoría con datos frescos.');
                        return entrada;
                    }

                    console.warn('⚠️ SessionStorage no tenía una entrada reutilizable; se continúa con localStorage.');
                } catch (e) {
                    console.warn('Error al cargar de sessionStorage:', e);
                    sessionStorage.removeItem('datosAuditoriaRecientes');
                }
            }
            
            // Si no hay sessionStorage, intentar localStorage
            const tablasCargadas = localStorage.getItem('tablasCargadas');
            if (!tablasCargadas) {
                console.warn('No hay tablas cargadas en localStorage');
                return null;
            }
            
            try {
                const tablas = JSON.parse(tablasCargadas);
                if (!Array.isArray(tablas) || tablas.length === 0) {
                    console.warn('tablasCargadas está vacío');
                    return null;
                }
                
                // Validar que todas las tablas tengan filas
                const tablasValidas = tablas.filter(t => {
                    const filas = t.filas || [];
                    return filas.length > 0;
                });
                
                if (tablasValidas.length === 0) {
                    console.warn('No hay tablas válidas en localStorage');
                    return null;
                }
                
                console.log(`📚 Cargadas ${tablasValidas.length} tabla(s) de localStorage`);
                
                // LÓGICA INTELIGENTE:
                // - Si hay 1 tabla: usar directamente (CASO 1)
                // - Si hay >1 tabla: construir mezcla ponderada (CASO 2)
                
                let resultado = null;
                
                if (tablasValidas.length === 1) {
                    // CASO 1: Una sola tabla (compatibilidad con flujo anterior)
                    const tabla = tablasValidas[0];
                    const filas = tabla.filas;
                    const tamices = filas.map(f => parseFloat(f.tamiz));
                    const valores = filas.map(f => parseFloat(f.porcentaje));
                    
                    // Detectar si son retidos o pasantes
                    const formato = detectarFormatoPortcentajes(valores);
                    const pasante_real = (formato === 'retidos') 
                        ? retidosAPassantes(valores)
                        : valores;
                    
                    // Intentar recuperar limites del localStorage si existen
                    let limite_min = [];
                    let limite_max = [];
                    const limitesGuardados = localStorage.getItem('limitesGranulometria');
                    if (limitesGuardados) {
                        try {
                            const limites = JSON.parse(limitesGuardados);
                            limite_min = limites.banda_min || [];
                            limite_max = limites.banda_max || [];
                        } catch (e) {
                            console.warn('Error al cargar límites guardados:', e);
                        }
                    }
                    
                    resultado = {
                        pasante_real: pasante_real,
                        tamices: tamices,
                        nombre: tabla.nombre || 'Tabla cargada',
                        banda_min: limite_min.length === tamices.length ? limite_min : [],
                        banda_max: limite_max.length === tamices.length ? limite_max : []
                    };
                    
                    console.log(`✅ CASO 1 (tabla única):`, resultado);
                    
                } else {
                    // CASO 2: Múltiples tablas → construir mezcla ponderada
                    resultado = construirMezclaDesdeMultiples(tablasValidas);
                    if (!resultado) {
                        console.error('Error al construir mezcla de múltiples tablas');
                        return null;
                    }
                    console.log(`✅ CASO 2 (múltiples tablas):`, resultado);
                }
                
                // Definir bandas por defecto como PASANTE acumulado.
                // Los valores históricos cargados aquí estaban en retenido y
                // desalineaban el gráfico respecto de pasante_real/pasante_virtual.
                const bandas_paver = {
                    '12.5': [100, 100],
                    '9.5': [100, 100],
                    '6.3': [90, 100],
                    '4.8': [78, 100],
                    '2.4': [60, 81],
                    '1.2': [39, 63],
                    '0.6': [22, 46],
                    '0.3': [8, 28],
                    '0.15': [0, 15],
                    '0.075': [0, 10]
                };
                
                const tieneBandasReales = Array.isArray(resultado.banda_min)
                    && Array.isArray(resultado.banda_max)
                    && resultado.banda_min.length === resultado.tamices.length
                    && resultado.banda_max.length === resultado.tamices.length;

                // Extraer banda_min y banda_max según tamices
                const banda_min = tieneBandasReales
                    ? resultado.banda_min.map(v => Number(v || 0))
                    : resultado.tamices.map(t => {
                        const key = t.toString();
                        return bandas_paver[key] ? bandas_paver[key][0] : 0;
                    });
                const banda_max = tieneBandasReales
                    ? resultado.banda_max.map(v => Number(v || 100))
                    : resultado.tamices.map(t => {
                        const key = t.toString();
                        return bandas_paver[key] ? bandas_paver[key][1] : 100;
                    });
                
                console.log(`📏 Bandas Paver aplicadas:`, {tamices: resultado.tamices, banda_min, banda_max});
                
                const retorno = {
                    pasante_real: resultado.pasante_real,
                    banda_min: banda_min,
                    banda_max: banda_max,
                    tamices: resultado.tamices,
                    nombre: resultado.nombre
                };
                
                // En CASO 2, agregar materiales para optimización
                if (resultado.materiales) {
                    retorno.materiales = resultado.materiales;
                    console.log(`📦 Materiales disponibles para optimización:`, resultado.materiales.map(m => m.nombre));
                }
                
                return retorno;
                
            } catch (e) {
                console.error('❌ Error al cargar datos de localStorage:', e);
                return null;
            }
        }

        // 🛡️ FUNCIÓN VALIDADORA CENTRALIZADA
        function validarDatosParaBackend(datos) {
            // Validación defensiva sin modificar datos
            let warnings = [];
            
            // Verificar estructura mínima
            if (!datos.pasante_real || !Array.isArray(datos.pasante_real)) {
                warnings.push('❌ pasante_real inválido o faltante');
            }
            
            if (!datos.tamices || !Array.isArray(datos.tamices)) {
                warnings.push('❌ tamices inválido o faltante');
            }
            
            // Verificar materiales
            if (datos.materiales === undefined) {
                warnings.push('⚠️ NO hay materiales en payload - backend no generará orden_operativa_real');
            } else if (!Array.isArray(datos.materiales)) {
                warnings.push('❌ materiales no es array');
            } else if (datos.materiales.length === 0) {
                warnings.push('⚠️ materiales array está vacío');
            } else {
                // Validar cada material
                datos.materiales.forEach((mat, idx) => {
                    if (!mat.nombre) warnings.push(`❌ Material ${idx}: nombre faltante`);
                    if (Array.isArray(datos.tamices) && datos.tamices.length > 0) {
                        if (Array.isArray(mat.pasantes) && mat.pasantes.length !== datos.tamices.length) {
                            warnings.push(`❌ Material "${mat.nombre}": pasantes len=${mat.pasantes.length} != tamices len=${datos.tamices.length}`);
                        }
                        if (Array.isArray(mat.retido_ind_pct) && mat.retido_ind_pct.length !== datos.tamices.length) {
                            warnings.push(`❌ Material "${mat.nombre}": retido_ind_pct len=${mat.retido_ind_pct.length} != tamices len=${datos.tamices.length}`);
                        }
                    }
                    if (mat.pasantes && Array.isArray(mat.pasantes)) {
                        const negatives = mat.pasantes.filter(v => v < 0);
                        if (negatives.length > 0) {
                            warnings.push(`⚠️ Material "${mat.nombre}": detectados valores negativos`);
                        }
                    }
                });
            }
            
            // Detectar valores negativos en pasante_real
            if (datos.pasante_real) {
                const negatives = datos.pasante_real.filter(v => v < 0);
                if (negatives.length > 0) {
                    warnings.push(`⚠️ pasante_real contiene negativos`);
                }
            }
            
            // Log de validación
            if (warnings.length > 0) {
                console.warn('🚨 ADVERTENCIAS DE VALIDACIÓN:');
                warnings.forEach(w => console.warn(`   ${w}`));
            } else {
                console.log('✅ Validación: todos los datos son consistentes');
            }
            
            return {
                isValid: warnings.length === 0,
                warnings: warnings,
                hasBasicStructure: !!datos.pasante_real && !!datos.tamices
            };
        }

        // 🔧 FUNCIÓN ADAPTER - Transforma datos para compatibilidad backend
        function adaptarDatosParaBackend(datos) {
            // Clona profundamente para NO modificar datos originales
            const datosClonados = JSON.parse(JSON.stringify(datos));
            const nTamices = Array.isArray(datosClonados.tamices) ? datosClonados.tamices.length : 0;
            
            // Si no hay materiales, devolver como está
            if (!datosClonados.materiales || !Array.isArray(datosClonados.materiales)) {
                console.log('[ADAPTER] No hay materiales para adaptar, enviando datos as-is');
                return datosClonados;
            }
            
            // Transformar cada material
            datosClonados.materiales = datosClonados.materiales.map((material, idx) => {
                try {
                    // PASO 1: Convertir peso → proporcion_pct
                    const proporcion_pct = Number.isFinite(Number(material.proporcion_pct))
                        ? Number(material.proporcion_pct)
                        : (Number(material.peso || 0) * 100);
                    
                    // PASO 2: Convertir pasantes (acumulados) → retido_ind_pct (individuales)
                    let retido_ind_pct = [];
                    const retidoOriginal = Array.isArray(material.retido_ind_pct) ? material.retido_ind_pct : [];
                    const usarRetidoOriginal = nTamices > 0 && retidoOriginal.length === nTamices;

                    if (usarRetidoOriginal) {
                        retido_ind_pct = retidoOriginal.map(v => Number(v || 0));
                    } else if (material.pasantes && Array.isArray(material.pasantes)) {
                        for (let i = 0; i < material.pasantes.length; i++) {
                            let valor;
                            if (i === 0) {
                                valor = 100 - Number(material.pasantes[0] || 0);
                            } else {
                                valor = Number(material.pasantes[i - 1] || 0) - Number(material.pasantes[i] || 0);
                            }

                            valor = Math.max(0, valor);
                            retido_ind_pct.push(valor);
                        }
                    }
                    
                    console.log('RETENIDO ORIGINAL:', retidoOriginal);
                    console.log('PASANTE GENERADO:', material.pasantes);
                    console.log('RECONVERSION RETENIDO:', retido_ind_pct);
                    
                    // PASO 3: Agregar nuevos campos sin remover los originales
                    return {
                        ...material,
                        retido_ind_pct: retido_ind_pct,
                        proporcion_pct: proporcion_pct
                        // Nota: Se mantienen pasantes y peso originales
                    };
                    
                } catch (error) {
                    console.error(`[ADAPTER] Error transformando material ${idx}:`, error);
                    return material; // Devolver sin cambios si hay error
                }
            });
            
            return datosClonados;
        }
        
        function ejecutarAuditoria(datos) {
            // 🔄 REFACTOR: Este es el ÚNICO punto de entrada al backend (POST /calculoPorRetenidos/auditoria)
            // RAZÓN: Garantiza que datos con materiales completos llegan al backend
            // El fetch automático fue deshabilitado para evitar envío de datos incompletos
            // RESULTADO: 
            //   ✅ datos locales se muestran SIN latencia
            //   ✅ backend se llama SOLO cuando usuario lo requiere
            //   ✅ backend recibe SIEMPRE datos completos con materiales
            
            // 🛡️ NUEVA: Validar datos ANTES de adaptar
            const validacion = validarDatosParaBackend(datos);
            
            // 🔧 NUEVA: Adaptar datos para compatibilidad con backend
            const datosAdaptados = adaptarDatosParaBackend(datos);
            
            // 📊 Log completo para debugging - ANTES/DESPUÉS
            console.log('[DEBUG] Enviando payload a /calculoPorRetenidos/auditoria');
            console.log('[ADAPTER] Materiales originales:', datos.materiales);
            console.log('[ADAPTER] Materiales adaptados:', datosAdaptados.materiales);
            console.log('[DEBUG] Estructura:', {
                tienePassante: !!datosAdaptados.pasante_real,
                tieneTamices: !!datosAdaptados.tamices,
                tieneMateriales: !!datosAdaptados.materiales,
                longitudMateriales: datosAdaptados.materiales?.length,
                primerMaterial: datosAdaptados.materiales?.[0] ? {
                    nombre: datosAdaptados.materiales[0].nombre,
                    tieneRetido_ind_pct: !!datosAdaptados.materiales[0].retido_ind_pct,
                    tieneProporcion_pct: !!datosAdaptados.materiales[0].proporcion_pct,
                    tienePassantes: !!datosAdaptados.materiales[0].pasantes,
                    tienePeso: !!datosAdaptados.materiales[0].peso
                } : null
            });
            
            const resultadoDiv = document.getElementById('resultado');
            resultadoDiv.innerHTML = `<div class="loading">⏳ ${tAuditoria('loading', 'Ejecutando auditoría...')}</div>`;

        // Función para toggle acordeón
        function toggleAccordion(button) {
            const body = button.nextElementSibling;
            const chevron = button.querySelector('span:last-child');
            
            const isOpen = body.style.display !== 'none';
            body.style.display = isOpen ? 'none' : 'block';
            chevron.style.transform = isOpen ? 'rotate(0deg)' : 'rotate(180deg)';
            chevron.style.transition = 'transform 0.3s ease';
        }

        function expandirSeccionesParaImpresion() {
            const cambios = [];
            const selectors = ['#resultado .detail-toggle button', '#resultado .accordion-header'];

            selectors.forEach((selector) => {
                document.querySelectorAll(selector).forEach((button) => {
                    const body = button.nextElementSibling;
                    const chevron = button.querySelector('span:last-child');
                    const estabaVisible = window.getComputedStyle(body).display !== 'none';

                    cambios.push({
                        body,
                        chevron,
                        estabaVisible,
                        display: body.style.display,
                        transform: chevron ? chevron.style.transform : ''
                    });

                    if (!estabaVisible) {
                        body.style.display = 'block';
                        if (chevron) {
                            chevron.style.transform = 'rotate(180deg)';
                        }
                    }
                });
            });

            return cambios;
        }

        function restaurarSeccionesDespuesDeImpresion(cambios) {
            cambios.forEach(({ body, chevron, estabaVisible, display, transform }) => {
                if (!estabaVisible) {
                    body.style.display = display || 'none';
                    if (chevron) {
                        chevron.style.transform = transform || 'rotate(0deg)';
                    }
                }
            });
        }

        function prepararGraficoPrincipalParaImpresion() {
            if (snapshotGraficoComparacion) {
                return Promise.resolve();
            }

            if (!instanciaChart || typeof instanciaChart.toBase64Image !== 'function') {
                return Promise.resolve();
            }

            const canvas = document.getElementById('graficoComparacion');
            if (!canvas || !canvas.parentElement) {
                return Promise.resolve();
            }

            const img = document.createElement('img');
            img.src = instanciaChart.toBase64Image();
            img.alt = tAuditoria('chart_image_alt', 'Curva de Referencia');
            img.className = 'grafico-print-snapshot';

            canvas.style.display = 'none';
            canvas.insertAdjacentElement('afterend', img);

            snapshotGraficoComparacion = { canvas, img };

            if (img.complete) {
                return Promise.resolve();
            }

            return new Promise((resolve) => {
                img.onload = () => resolve();
                img.onerror = () => resolve();
            });
        }

        function restaurarGraficoPrincipalDespuesDeImpresion() {
            if (!snapshotGraficoComparacion) {
                return;
            }

            const { canvas, img } = snapshotGraficoComparacion;
            if (img && img.parentElement) {
                img.remove();
            }
            if (canvas) {
                canvas.style.display = '';
            }

            snapshotGraficoComparacion = null;
        }

        function resizeChartsParaImpresion() {
            [instanciaErrorChart, instanciaDesviacionChart].forEach((chart) => {
                if (!chart || typeof chart.resize !== 'function') {
                    return;
                }

                const canvas = chart.canvas;
                const contenedor = canvas && (canvas.closest('.grafico-container') || canvas.parentElement);
                const ancho = contenedor ? Math.floor(contenedor.clientWidth) : undefined;
                const alto = contenedor ? Math.floor(contenedor.clientHeight) : undefined;

                if (ancho && alto) {
                    chart.resize(ancho, alto);
                } else if (ancho) {
                    chart.resize(ancho);
                } else {
                    chart.resize();
                }

                chart.update('none');
            });
        }

                restaurarSeccionesDespuesDeImpresion(cambios);
                window.removeEventListener('afterprint', onAfterPrint);
            };

            window.addEventListener('afterprint', onAfterPrint);

        // Función para dibujar gráficos de análisis (Error y Desviación)
        function dibujarGraficosAnalisis(datos, entrada) {
            // Destruir instancias previas de charts
            if (instanciaErrorChart) {
                instanciaErrorChart.destroy();
                instanciaErrorChart = null;
            }
            if (instanciaDesviacionChart) {
                instanciaDesviacionChart.destroy();
                instanciaDesviacionChart = null;
            }
            
            // === GRÁFICO 1: ERROR POR TAMIZ ===
            const ctxError = document.getElementById('errorTamizChart');
            if (ctxError) {
                const errors_real = [];
                const errors_virtual = [];
                
                for (let i = 0; i < datos.tamices.length; i++) {
                    const minB = datos.banda_min[i];
                    const maxB = datos.banda_max[i];
                    const real = datos.pasante_real[i];
                    const virt = datos.pasante_virtual[i];
                    
                    const errorReal = Math.max(0, 
                        minB - real, 
                        real - maxB
                    );
                    const errorVirt = Math.max(0, 
                        minB - virt, 
                        virt - maxB
                    );
                    
                    errors_real.push(parseFloat(errorReal.toFixed(2)));
                    errors_virtual.push(parseFloat(errorVirt.toFixed(2)));
                }
                
                instanciaErrorChart = new Chart(ctxError, {
                    type: 'bar',
                    data: {
                        labels: datos.tamices.slice().reverse().map(t => t + ' mm'),
                        datasets: [
                            {
                                label: tAuditoria('chart_error_real', 'Error Real'),
                                data: errors_real.slice().reverse(),
                                backgroundColor: '#0066cc',
                                borderColor: '#003d99',
                                borderWidth: 1
                            },
                            {
                                label: tAuditoria('chart_error_virtual', 'Error Virtual'),
                                data: errors_virtual.slice().reverse(),
                                backgroundColor: '#dc3545',
                                borderColor: '#a02830',
                                borderWidth: 1
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            y: {
                                beginAtZero: true,
                                title: {
                                    display: true,
                                    text: tAuditoria('chart_axis_error', 'Error (%)')
                                }
                            }
                        },
                        plugins: {
                            legend: {
                                display: true,
                                position: 'top'
                            },
                            title: {
                                display: true,
                                text: tAuditoria('chart_title_error', 'ERROR por Tamiz')
                            }
                        }
                    }
                });
            }
            
            // === GRÁFICO 2: DESVIACIÓN vs CENTRO DE BANDA ===
            const ctxDesviacion = document.getElementById('desviacionChart');
            if (ctxDesviacion) {
                const desv_real = [];
                const desv_virtual = [];
                const limite_ideal = [];
                
                for (let i = 0; i < datos.tamices.length; i++) {
                    const minB = datos.banda_min[i];
                    const maxB = datos.banda_max[i];
                    const center = (minB + maxB) / 2;
                    const real = datos.pasante_real[i];
                    const virt = datos.pasante_virtual[i];
                    
                    desv_real.push(parseFloat(Math.abs(real - center).toFixed(2)));
                    desv_virtual.push(parseFloat(Math.abs(virt - center).toFixed(2)));
                    limite_ideal.push(5.5); // Límite de calidad
                }
                
                instanciaDesviacionChart = new Chart(ctxDesviacion, {
                    type: 'bar',
                    data: {
                        labels: datos.tamices.slice().reverse().map(t => t + ' mm'),
                        datasets: [
                            {
                                label: tAuditoria('chart_deviation_real', 'Real'),
                                data: desv_real.slice().reverse(),
                                backgroundColor: '#0066cc',
                                borderColor: '#003d99',
                                borderWidth: 1
                            },
                            {
                                label: tAuditoria('chart_deviation_virtual', 'Virtual'),
                                data: desv_virtual.slice().reverse(),
                                backgroundColor: '#dc3545',
                                borderColor: '#a02830',
                                borderWidth: 1
                            },
                            {
                                label: tAuditoria('chart_ideal_limit', 'Límite ideal (±5.5%)'),
                                data: limite_ideal.slice().reverse(),
                                borderColor: '#ffc107',
                                backgroundColor: 'transparent',
                                borderWidth: 2,
                                borderDash: [5, 5],
                                type: 'line',
                                fill: false,
                                pointRadius: 0
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            y: {
                                beginAtZero: true,
                                title: {
                                    display: true,
                                    text: tAuditoria('chart_axis_deviation', 'Desviación (%)')
                                }
                            }
                        },
                        plugins: {
                            legend: {
                                display: true,
                                position: 'top'
                            },
                            title: {
                                display: true,
                                text: tAuditoria('chart_title_deviation', 'DESVIACIÓN vs Centro de Banda')
                            }
                        }
                    }
                });
            }
        }
        
        function dibujarGrafico(datos, entrada) {
            const ctx = document.getElementById('graficoComparacion').getContext('2d');
            
            // Destruir instancia anterior de Chart.js si existe
            if (instanciaChart) {
                instanciaChart.destroy();
                instanciaChart = null;
            }
            
            // Mostrar tamices de fino a grueso en el eje X: 0.075 -> 12.5.
            const labels = datos.tamices.slice().reverse().map(t => `${t} mm`);
            const datasets = [];
            const pasanteEntradaOriginal = Array.isArray(datos.pasante_entrada_original)
                ? datos.pasante_entrada_original
                : (entrada && Array.isArray(entrada.pasante_real) ? entrada.pasante_real : null);
            const resultadoCalculadoGrafico = datos.pasante_real.map((valor) => 100 - Number(valor || 0));

            const bandaMinGrafico = datos.banda_min.slice();
            const bandaMaxGrafico = datos.banda_max.slice();

            console.log('[GRAFICO] Banda Min pasante:', bandaMinGrafico.map(v => v.toFixed(1)));
            console.log('[GRAFICO] Banda Max pasante:', bandaMaxGrafico.map(v => v.toFixed(1)));

            if (Array.isArray(pasanteEntradaOriginal) && pasanteEntradaOriginal.length === datos.tamices.length) {
                datasets.push({
                    label: tAuditoria('chart_initial_input', 'ANTES · Datos crudos desde localStorage'),
                    data: pasanteEntradaOriginal.slice().reverse(),
                    borderColor: '#d97706',
                    backgroundColor: 'rgba(217, 119, 6, 0.12)',
                    borderWidth: 4,
                    borderDash: [10, 5],
                    pointRadius: 5,
                    pointBackgroundColor: '#d97706',
                    fill: false,
                    tension: 0.2
                });
            }

            datasets.push(
                {
                    label: tAuditoria('chart_mix_result', 'DESPUÉS · Resultado calculado'),
                    data: resultadoCalculadoGrafico.slice().reverse(),
                    borderColor: '#0066cc',
                    backgroundColor: 'rgba(0, 102, 204, 0.1)',
                    borderWidth: 2,
                    pointRadius: 5,
                    pointBackgroundColor: '#0066cc',
                    tension: 0.3
                }
            );
            
            // Agregar bandas
            datasets.push(
                {
                    label: tAuditoria('chart_band_min', 'Banda Min'),
                    data: bandaMinGrafico.slice().reverse(),
                    borderColor: '#28a745',
                    borderWidth: 2,
                    borderDash: [5, 5],
                    fill: false,
                    tension: 0.3,
                    pointRadius: 3,
                    pointBackgroundColor: '#28a745'
                },
                {
                    label: tAuditoria('chart_band_max', 'Banda Max'),
                    data: bandaMaxGrafico.slice().reverse(),
                    borderColor: '#ffc107',
                    borderWidth: 2,
                    borderDash: [5, 5],
                    fill: false,
                    tension: 0.3,
                    pointRadius: 3,
                    pointBackgroundColor: '#ffc107'
                },
                {
                    label: tAuditoria('chart_fuller_ideal', 'Curva Fuller Ideal'),
                    data: Array.isArray(datos.fuller_ideal) ? datos.fuller_ideal.slice().reverse() : [],
                    borderColor: '#FFD700',
                    borderWidth: 3,
                    fill: false,
                    tension: 0.3,
                    pointRadius: 2,
                    pointBackgroundColor: '#FFD700'
                }
            );
            
            // ✅ Agregar curva VIRTUAL AL FINAL (se dibuja al último, quedando visible sobre azul)
            if (Array.isArray(datos.pasante_virtual) && datos.pasante_virtual.length === datos.tamices.length) {
                console.log('✅ Curva virtual detectada, agregando al FINAL (para dibujarse sobre la azul)...');
                console.log('   Datos:', {
                    largo_tamices: datos.tamices.length,
                    largo_pasante_virtual: datos.pasante_virtual.length,
                    valores: datos.pasante_virtual.slice(0, 3).map(v => v.toFixed(2)).join(', ') + '...'
                });
                datasets.push({
                    label: tAuditoria('chart_virtual_output', 'Tabla Virtual (Salida)'),
                    data: datos.pasante_virtual.slice().reverse(),
                    borderColor: '#dc3545',
                    backgroundColor: 'rgba(220, 53, 69, 0.2)',
                    borderWidth: 3.5,  // ← MÁS GRUESA para que se vea
                    pointRadius: 6,     // ← PUNTOS MÁS GRANDES
                    pointBackgroundColor: '#dc3545',
                    borderDash: [2, 3], // ← PUNTILLADA SUTIL para diferenciar
                    tension: 0.3
                });
            } else {
                console.warn('❌ Curva virtual NO disponible o incompleta', {
                    existente: !!datos.pasante_virtual,
                    esArray: Array.isArray(datos.pasante_virtual),
                    largo: datos.pasante_virtual?.length,
                    largo_esperado: datos.tamices.length
                });
            }
            
            // 🔍 DEBUG: Listar todos los datasets
            console.log('📈 [CHART] Datasets creados:', datasets.length);
            datasets.slice(0, 3).forEach((ds, i) => {
                const dataMuestra = ds.data?.slice(0, 3).map(v => (typeof v === 'number' ? v.toFixed(1) : v)).join(', ') || 'N/A';
                console.log(`   ${i+1}. ${ds.label}: ${ds.data?.length ?? 0} puntos, color=${ds.borderColor}, primeros 3 valores=[${dataMuestra}]`);
            });
            
            instanciaChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: datasets
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top'
                        },
                        title: {
                            display: true,
                            text: tAuditoria('chart_title_curves', 'Comparación de Curvas Granulométricas')
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 105,
                            title: {
                                display: true,
                                text: tAuditoria('chart_axis_passing', 'Pasante Acumulado (%)')
                            }
                        },
                        x: {
                            title: {
                                display: true,
                                text: tAuditoria('chart_axis_sieve', 'Tamiz (mm)')
                            }
                        }
                    }
                }
            });
        }
        
        // 📋 Cargar JSON del localStorage en el textarea
        function cargarJSONEnTextarea() {
            const tablasCargadas = localStorage.getItem('tablasCargadas');
            if (tablasCargadas) {
                try {
                    const datos = JSON.parse(tablasCargadas);
                    document.getElementById('jsonInput').value = JSON.stringify(datos, null, 2);
                    console.log('✅ JSON cargado en textarea desde localStorage.tablasCargadas');
                } catch (e) {
                    console.error('❌ Error al cargar JSON en textarea:', e);
                }
            }
        }
        
        // Cargar ejemplo al abrir la página
        window.addEventListener('load', () => {
            applyAuditoriaTranslations();
            cargarJSONEnTextarea();
            usarEjemplo();
        });
    </script>
</body>
</html>
