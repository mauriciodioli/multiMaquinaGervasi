<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auditoría de Mezcla Granulométrica</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
        }
        
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            border-bottom: 3px solid #0066cc;
            padding-bottom: 15px;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .section {
            margin: 30px 0;
            padding: 20px;
            border-left: 4px solid #0066cc;
            background: #f9f9f9;
            border-radius: 4px;
        }
        
        .section h2 {
            color: #0066cc;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .section h2::before {
            content: '📊';
        }
        
        .criterio {
            margin: 15px 0;
            padding: 12px;
            background: white;
            border-radius: 4px;
            border-left: 3px solid #ddd;
        }
        
        .criterio.ok {
            border-left-color: #28a745;
            background: #f0fff4;
        }
        
        .criterio.warning {
            border-left-color: #ffc107;
            background: #fffbf0;
        }
        
        .criterio.error {
            border-left-color: #dc3545;
            background: #fff5f5;
        }
        
        .criterio label {
            font-weight: bold;
            color: #444;
            display: block;
            margin-bottom: 5px;
        }
        
        .criterio .value {
            font-size: 18px;
            color: #0066cc;
            font-weight: bold;
        }
        
        .decision-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            text-align: center;
        }
        
        .decision-box h3 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        
        .decision-box p {
            font-size: 16px;
            opacity: 0.9;
        }
        
        .semaforo {
            text-align: center;
            font-size: 48px;
            margin: 15px 0;
        }
        
        .tabla-receta {
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0;
        }
        
        .tabla-receta thead {
            background: #0066cc;
            color: white;
        }
        
        .tabla-receta th,
        .tabla-receta td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        
        .tabla-receta tbody tr:nth-child(even) {
            background: #f9f9f9;
        }
        
        .tabla-receta tbody tr:hover {
            background: #f0f0f0;
        }
        
        .grafico-container {
            position: relative;
            height: 400px;
            margin: 30px 0;
            background: white;
            padding: 20px;
            border-radius: 4px;
            border: 1px solid #eee;
        }
        
        .instruccion {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            padding: 15px;
            border-radius: 4px;
            margin: 15px 0;
            font-size: 15px;
            color: #444;
            line-height: 1.6;
        }
        
        .proporciones {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 15px 0;
        }
        
        .proporcion-item {
            background: white;
            border: 2px solid #0066cc;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }
        
        .proporcion-item .nombre {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
        }
        
        .proporcion-item .valor {
            font-size: 28px;
            font-weight: bold;
            color: #0066cc;
        }
        
        .mejora-item {
            display: inline-block;
            background: white;
            border: 1px solid #ddd;
            padding: 15px 20px;
            margin: 10px 10px 10px 0;
            border-radius: 4px;
            font-size: 14px;
        }
        
        .mejora-item .label {
            color: #666;
            display: block;
            font-size: 12px;
            margin-bottom: 5px;
        }
        
        .mejora-item .valor {
            font-size: 18px;
            font-weight: bold;
            color: #28a745;
        }
        
        .carga-datos {
            background: #f0f0f0;
            padding: 20px;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        
        .carga-datos input,
        .carga-datos button {
            padding: 10px 15px;
            margin: 5px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        
        .carga-datos button {
            background: #0066cc;
            color: white;
            cursor: pointer;
            border: none;
        }
        
        .carga-datos button:hover {
            background: #0052a3;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .error-box {
            background: #fff5f5;
            border: 1px solid #fc8181;
            border-left: 4px solid #f56565;
            color: #c53030;
            padding: 15px;
            border-radius: 4px;
            margin: 15px 0;
        }
        
        .success-box {
            background: #f0fff4;
            border: 1px solid #9ae6b4;
            border-left: 4px solid #38a169;
            color: #22543d;
            padding: 15px;
            border-radius: 4px;
            margin: 15px 0;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }
            
            .proporciones {
                grid-template-columns: 1fr;
            }
            
            .grafico-container {
                height: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔬 Auditoría de Mezcla Granulométrica</h1>
        <p class="subtitle">Evaluación de cumplimiento de banda y decisión de tabla virtual dirigida</p>
        
        <!-- Sección de carga de datos -->
        <div class="carga-datos">
            <h3>Cargar datos desde archivo JSON o ingreso manual</h3>
            <textarea id="jsonInput" style="width:100%; height:100px; margin: 10px 0; padding: 10px; font-family: monospace; border: 1px solid #ddd; border-radius: 4px;" placeholder='{"pasante_real": [...], "banda_min": [...], "banda_max": [...], "tamices": [...]}'></textarea>
            <button onclick="cargarDatos()">📤 Cargar JSON</button>
            <button onclick="usarEjemplo()">📋 Usar ejemplo</button>
        </div>
        
        <!-- Resultado -->
        <div id="resultado"></div>
    </div>
    
    <script>
        // Cargar datos desde localStorage.tablasCargadas y convertir a formato de auditoría
        function cargarDatosDelStorage() {
            // Primero intentar cargar desde sessionStorage (vienen del modal)
            const datosSession = sessionStorage.getItem('datosAuditoriaRecientes');
            if (datosSession) {
                try {
                    const { datos, entrada } = JSON.parse(datosSession);
                    console.log('✅ Datos cargados desde sessionStorage (modal)');
                    sessionStorage.removeItem('datosAuditoriaRecientes');
                    // Mostrar directo sin esperar
                    setTimeout(() => mostrarResultado(datos, entrada), 100);
                    return null;
                } catch (e) {
                    console.warn('Error al cargar de sessionStorage:', e);
                }
            }
            
            // Si no hay sessionStorage, intentar localStorage
            const tablasCargadas = localStorage.getItem('tablasCargadas');
            if (!tablasCargadas) {
                console.warn('No hay tablas cargadas en localStorage');
                return null;
            }
            
            try {
                const tablas = JSON.parse(tablasCargadas);
                if (!Array.isArray(tablas) || tablas.length === 0) {
                    console.warn('tablasCargadas está vacío');
                    return null;
                }
                
                // Usar la primera tabla cargada
                const tabla = tablas[0];
                const filas = tabla.filas || [];
                
                if (filas.length === 0) {
                    console.warn('La tabla no tiene filas');
                    return null;
                }
                
                // Extraer tamices y PASANTES ACUMULADOS (ya están en el formato correcto)
                const tamices = filas.map(f => parseFloat(f.tamiz));
                const pasante_real = filas.map(f => parseFloat(f.porcentaje));
                
                // Los porcentajes en localStorage YA SON PASANTES ACUMULADOS
                // No necesitan conversión, se usan directamente
                
                // Definir bandas por defecto (norma típica)
                // Estos son valores estándar para agregados finos
                const banda_min = [85, 70, 50, 35, 15, 5, 0].slice(0, tamices.length);
                const banda_max = [100, 90, 75, 60, 30, 15, 10].slice(0, tamices.length);
                
                console.log('Pasante cargado desde localStorage:', pasante_real);
                
                return {
                    pasante_real: pasante_real,
                    banda_min: banda_min,
                    banda_max: banda_max,
                    tamices: tamices,
                    nombre: tabla.nombre || 'Tabla cargada'
                };
            } catch (e) {
                console.error('Error al cargar datos de localStorage:', e);
                return null;
            }
        }
        
        // Intentar cargar desde localStorage, si no, usar ejemplo por defecto
        let datosEjemplo = cargarDatosDelStorage() || {
            pasante_real: [99.20, 76.60, 35.20, 12.40, 6.50, 4.70, 1.40],
            banda_min: [85, 65, 35, 15, 5, 2, 0],
            banda_max: [100, 90, 65, 45, 20, 10, 5],
            tamices: [8, 5, 3.15, 2, 1, 0.5, 0.1],
            nombre: 'Ejemplo por defecto'
        };
        
        function usarEjemplo() {
            // Actualizar por si cambiaron los datos en localStorage
            const datosActuales = cargarDatosDelStorage() || datosEjemplo;
            document.getElementById('jsonInput').value = JSON.stringify(datosActuales, null, 2);
            cargarDatos();
        }
        
        function cargarDatos() {
            const jsonText = document.getElementById('jsonInput').value;
            try {
                const datos = JSON.parse(jsonText);
                ejecutarAuditoria(datos);
            } catch (e) {
                mostrarError('Error al parsear JSON: ' + e.message);
            }
        }
        
        function ejecutarAuditoria(datos) {
            const resultadoDiv = document.getElementById('resultado');
            resultadoDiv.innerHTML = '<div class="loading">⏳ Ejecutando auditoría...</div>';
            
            fetch('/calculoPorRetenidos/auditoria', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(datos)
            })
            .then(response => response.json())
            .then(result => {
                if (result.exito) {
                    mostrarResultado(result.data, datos);
                } else {
                    mostrarError(result.error);
                }
            })
            .catch(error => {
                mostrarError('Error de conexión: ' + error.message);
            });
        }
        
        function mostrarError(mensaje) {
            document.getElementById('resultado').innerHTML = 
                `<div class="error-box"><strong>❌ Error:</strong> ${mensaje}</div>`;
        }
        
        function mostrarResultado(datos, entrada) {
            const fase1 = datos.fase_1;
            const criterios = datos.fase_2_4_criterios;
            const fase5 = datos.fase_5_virtual;
            const fase6 = datos.fase_6_receta;
            const grafico = datos.para_grafico;
            
            let html = '';
            
            // Fase 1
            html += `
                <div class="section">
                    <h2>Fase 1️⃣ Evaluación Inicial</h2>
                    <div class="criterio ok">
                        <label>Cumplimiento de Banda</label>
                        <span class="value">${fase1.cumpl_count}/${fase1.n_tamices} tamices (${fase1.cumplimiento_pct}%)</span>
                    </div>
                    <div class="criterio">
                        <label>Error Total</label>
                        <span class="value">${fase1.error_total}%</span>
                    </div>
                    <div class="criterio">
                        <label>Estado</label>
                        <span class="value">${fase1.estado}</span>
                    </div>
                </div>
            `;
            
            // Criterios de Decisión
            const cumpleEstilo = criterios.cumple_banda ? 'ok' : 'error';
            const calidadEstilo = criterios.es_buena_calidad ? 'ok' : 'warning';
            
            html += `
                <div class="section">
                    <h2>Fase 2-4️⃣ Criterios de Decisión</h2>
                    <div class="criterio ${cumpleEstilo}">
                        <label>Criterio 1 - Cumplimiento de Banda (OBLIGATORIO)</label>
                        <div><strong>${criterios.cumplimiento_banda_pct.toFixed(1)}%</strong> / 95.0% requerido</div>
                        <div style="margin-top: 5px; color: ${criterios.cumple_banda ? '#28a745' : '#dc3545'}; font-weight: bold;">
                            ${criterios.cumple_banda ? '✓ CUMPLE' : '✗ NO CUMPLE'}
                        </div>
                    </div>
                    <div class="criterio ${calidadEstilo}">
                        <label>Criterio 2 - Desviación del Centro (Calidad Opcional)</label>
                        <div><strong>${criterios.desviacion_media_centro.toFixed(2)}%</strong> / ±5.5% ideal</div>
                        <div style="margin-top: 5px; color: ${criterios.es_buena_calidad ? '#28a745' : '#ff9800'}; font-weight: bold;">
                            ${criterios.es_buena_calidad ? '✓ BUENA CALIDAD' : '⚠ CALIDAD MEJORA'}
                        </div>
                    </div>
                </div>
            `;
            
            // Decisión
            const decisionColor = criterios.cumple_banda ? '#28a745' : '#0066cc';
            const decisionEmoji = criterios.cumple_banda ? '✓' : '⚠';
            
            html += `
                <div class="decision-box">
                    <h3>${decisionEmoji} ${criterios.decision}</h3>
                    <p>${criterios.razon}</p>
                </div>
            `;
            
            // Fase 5 - Virtual
            if (fase5.generada) {
                html += `
                    <div class="section">
                        <h2>Fase 5️⃣ Tabla Virtual Generada</h2>
                        <div class="criterio ${fase5.valida ? 'ok' : 'warning'}">
                            <label>Cumplimiento con TV</label>
                            <div><strong>${fase5.cumpl_count}/7 tamices (${fase5.cumplimiento_pct}%)</strong></div>
                        </div>
                        <div class="criterio">
                            <label>Mejoras Conseguidas</label>
                            <div><strong>Cumplimiento: +${fase5.mejora_cumplimiento} tamiz${fase5.mejora_cumplimiento !== 1 ? 'es' : ''}</strong></div>
                            <div><strong>Error reducido: ${fase5.mejora_error}%</strong></div>
                        </div>
                    </div>
                `;
            }
            
            // Fase 6 - Receta
            const proporciones = fase6.proporciones;
            html += `
                <div class="section">
                    <h2>Fase 6️⃣ Receta Final para Producción</h2>
                    
                    <h3 style="margin-top: 20px; color: #0066cc;">Proporciones Finales</h3>
                    <div class="proporciones">
                        <div class="proporcion-item">
                            <div class="nombre">Tabla Real</div>
                            <div class="valor">${proporciones.tabla_real_pct.toFixed(1)}%</div>
                        </div>
            `;
            
            if (proporciones.tabla_virtual_pct > 0) {
                html += `
                        <div class="proporcion-item">
                            <div class="nombre">Tabla Virtual</div>
                            <div class="valor">${proporciones.tabla_virtual_pct.toFixed(1)}%</div>
                        </div>
                `;
            }
            
            html += `
                        <div class="proporcion-item" style="background: #fffbf0; border-color: #ff9800;">
                            <div class="nombre">TOTAL</div>
                            <div class="valor" style="color: #ff9800;">${proporciones.total_pct.toFixed(1)}%</div>
                        </div>
                    </div>
                    
                    <h3 style="margin-top: 20px; color: #0066cc;">Semáforo</h3>
                    <div class="semaforo">${fase6.semaforo}</div>
                    
                    <h3 style="margin-top: 20px; color: #0066cc;">Instrucción Operativa</h3>
                    <div class="instruccion">${fase6.instruction}</div>
                </div>
            `;
            
            // Gráfico comparativo
            html += `
                <div class="section">
                    <h2>Comparação: Real vs Virtual</h2>
                    <div class="grafico-container">
                        <canvas id="graficoComparacion"></canvas>
                    </div>
                </div>
            `;
            
            // Tabla detallada
            html += `
                <div class="section">
                    <h2>Tabla Detallada</h2>
                    <table class="tabla-receta">
                        <thead>
                            <tr>
                                <th>Tamiz (mm)</th>
                                <th>Pasante Real</th>
                                <th style="border-right: 2px solid #999;">Banda Min-Max</th>
                                <th>Pasante Virtual</th>
                                <th>Estado Real</th>
                                <th>Estado Virtual</th>
                            </tr>
                        </thead>
                        <tbody>
            `;
            
            for (let i = 0; i < entrada.tamices.length; i++) {
                const tamiz = entrada.tamices[i];
                const pasanteReal = entrada.pasante_real[i];
                const pasanteVirt = fase6.tabla_virtual_pasante[i];
                const bandaMin = entrada.banda_min[i];
                const bandaMax = entrada.banda_max[i];
                
                const estadoReal1 = (pasanteReal >= bandaMin && pasanteReal <= bandaMax) ? '✓' : '✗';
                const estadoVirt = (pasanteVirt >= bandaMin && pasanteVirt <= bandaMax) ? '✓' : '✗';
                
                html += `
                    <tr>
                        <td><strong>${tamiz}</strong></td>
                        <td>${pasanteReal.toFixed(2)}%</td>
                        <td style="border-right: 2px solid #999;">[${bandaMin}-${bandaMax}]%</td>
                        <td>${pasanteVirt.toFixed(2)}%</td>
                        <td><strong style="color: ${estadoReal1 === '✓' ? '#28a745' : '#dc3545'}">${estadoReal1}</strong></td>
                        <td><strong style="color: ${estadoVirt === '✓' ? '#28a745' : '#dc3545'}">${estadoVirt}</strong></td>
                    </tr>
                `;
            }
            
            html += `
                        </tbody>
                    </table>
                </div>
            `;
            
            document.getElementById('resultado').innerHTML = html;
            
            // Dibujar gráfico
            setTimeout(() => {
                dibujarGrafico(grafico, entrada);
            }, 100);
        }
        
        function dibujarGrafico(datos, entrada) {
            const ctx = document.getElementById('graficoComparacion').getContext('2d');
            
            // Invertir tamices para mostrar de menor a mayor en el eje X
            const labels = datos.tamices.slice().reverse().map(t => `${t} mm`);
            
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Tabla Real',
                            data: datos.pasante_real.slice().reverse(),
                            borderColor: '#0066cc',
                            backgroundColor: 'rgba(0, 102, 204, 0.1)',
                            borderWidth: 2,
                            pointRadius: 5,
                            pointBackgroundColor: '#0066cc',
                            tension: 0.3
                        },
                        {
                            label: 'Tabla Virtual',
                            data: datos.pasante_virtual.slice().reverse(),
                            borderColor: '#dc3545',
                            backgroundColor: 'rgba(220, 53, 69, 0.1)',
                            borderWidth: 2,
                            pointRadius: 5,
                            pointBackgroundColor: '#dc3545',
                            tension: 0.3
                        },
                        {
                            label: 'Banda Min',
                            data: datos.banda_min.slice().reverse(),
                            borderColor: '#28a745',
                            borderWidth: 1,
                            borderDash: [5, 5],
                            fill: false,
                            tension: 0.3
                        },
                        {
                            label: 'Banda Max',
                            data: datos.banda_max.slice().reverse(),
                            borderColor: '#ffc107',
                            borderWidth: 1,
                            borderDash: [5, 5],
                            fill: false,
                            tension: 0.3
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top'
                        },
                        title: {
                            display: true,
                            text: 'Comparación de Curvas Granulométricas'
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 105,
                            title: {
                                display: true,
                                text: 'Pasante Acumulado (%)'
                            }
                        },
                        x: {
                            title: {
                                display: true,
                                text: 'Tamiz (mm)'
                            }
                        }
                    }
                }
            });
        }
        
        // Cargar ejemplo al abrir la página
        window.addEventListener('load', () => {
            usarEjemplo();
        });
    </script>
</body>
</html>
