<!-- templates/restablecer_password.html -->
{% extends "layouts/layout.html" %}

{% block content %}
<div class="container" style="max-width: 400px; margin: 40px auto;">
  <h2>{{ t_menu["restablecer"] }}</h2>
  {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
  {% endif %}
  <form method="POST">
    <div class="mb-3 password-container">
      <label for="actual" class="form-label">{{ t_menu["actual_pass"] }}</label>
      <input type="password" class="form-control" name="actual" id="actual" required>
      <button type="button" class="toggle-password" onclick="togglePassword('actual')" tabindex="-1" aria-label="Mostrar/Ocultar contraseña">👁</button>
    </div>
    <div class="mb-3 password-container">
      <label for="nueva" class="form-label">{{ t_menu["nueva_pass"] }}</label>
      <input type="password" class="form-control" name="nueva" id="nueva" required>
      <button type="button" class="toggle-password" onclick="togglePassword('nueva')" tabindex="-1" aria-label="Mostrar/Ocultar contraseña">👁</button>
    </div>
    <div class="mb-3 password-container">
      <label for="confirmar" class="form-label">{{ t_menu["confirmar_pass"] }}</label>
      <input type="password" class="form-control" name="confirmar" id="confirmar" required>
      <button type="button" class="toggle-password" onclick="togglePassword('confirmar')" tabindex="-1" aria-label="Mostrar/Ocultar contraseña">👁</button>
    </div>
    <button type="submit" class="btn btn-primary" style="width:100%;">{{ t_menu["restablecer"] }}</button>
  </form>
</div>

<style>
.password-container {
  position: relative;
  width: 100%;
}

.password-container input {
  width: 100%;
  box-sizing: border-box;
  padding-right: 2.5em; /* Espacio para el botón */
}

.toggle-password {
  position: absolute;
  right: 10px;
  top: 65%;
  transform: translateY(-50%);
  background: none;
  border: none;
  cursor: pointer;
  font-size: 1.2em;
  padding: 0;
  line-height: 1;
  width: 2em;
  height: 2em;
  display: flex;
  align-items: center;
  justify-content: center;
}
</style>

<script>
function togglePassword(id) {
  const input = document.getElementById(id);
  input.type = input.type === 'password' ? 'text' : 'password';
}
</script>
{% endblock %}
