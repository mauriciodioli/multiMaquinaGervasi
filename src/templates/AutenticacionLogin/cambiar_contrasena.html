{% extends "layouts/layout.html" %}

{% block content %}
<div class="container mt-5">
  <h2>{{ t_menu["restablecer"] }}</h2>
  {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
  {% endif %}
  <form method="POST">
    <div class="mb-3">
      <label for="actual" class="form-label">{{ t_menu["nueva_pass"] }}</label>
      <input type="password" class="form-control" name="actual" required>
    </div>
    <div class="mb-3">
      <label for="nueva" class="form-label">{{ t_menu["nueva_pass"] }}</label>
      <input type="password" class="form-control" name="nueva" required>
    </div>
    <div class="mb-3">
      <label for="confirmar" class="form-label">{{ t_menu["confirmar_pass"] }}</label>
      <input type="password" class="form-control" name="confirmar" required>
    </div>
    <button type="submit" class="btn btn-primary">{{ t_menu["restablecer"] }}</button>
  </form>
</div>
{% endblock %}
