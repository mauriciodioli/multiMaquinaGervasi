<!--envia al endpoint administracion_crud_usuario_seleccionar_entidad-->
<!DOCTYPE html>
<html lang="{{ language }}">
<head>
  <meta charset="UTF-8">
  <title>
    {% if language == 'es' %}Seleccionar Entidad{% elif language == 'en' %}Select Entity{% elif language == 'it' %}Seleziona Entità{% endif %}
  </title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center align-items-center vh-100">

  <div class="card shadow p-4" style="min-width: 300px;">
    <h4 class="mb-3 text-center">
      {% if language == 'es' %}
        Selecciona tu entidad
      {% elif language == 'en' %}
        Select your entity
      {% elif language == 'it' %}
        Seleziona la tua entità
      {% else %}
        Selecciona tu entidad
      {% endif %}
    </h4>

    <form method="POST" action="/administracion_crud_usuario_seleccionar_entidad/">
      <div class="mb-3">
        <label for="entidad" class="form-label">
          {% if language == 'es' %}
            Entidad
          {% elif language == 'en' %}
            Entity
          {% elif language == 'it' %}
            Entità
          {% else %}
            Entidad
          {% endif %}
        </label>
        <select class="form-select" name="entidad_id" id="entidad" required>
          {% for entidad in entidades %}
            <option value="{{ entidad.id }}">{{ entidad.nombre }}</option>
          {% endfor %}
        </select>
      </div>
      <button type="submit" class="btn btn-primary w-100">
        {% if language == 'es' %}
          Confirmar
        {% elif language == 'en' %}
          Confirm
        {% elif language == 'it' %}
          Conferma
        {% else %}
          Confirmar
        {% endif %}
      </button>
    </form>
  </div>

</body>
</html>
