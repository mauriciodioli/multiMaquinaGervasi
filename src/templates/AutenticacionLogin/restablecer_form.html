<!-- templates/AutenticacionLogin/restablecer_form.html -->
<!DOCTYPE html>
<html lang="{{ t.lang or 'es' }}">
<head>
  <meta charset="UTF-8">
  <title>{{ t.restablecer }} | Gervasi</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/autenticacion/login.css') }}">
  <style>
    .password-container {
      position: relative;
    }
    .toggle-password {
      position: absolute;
      right: 10px;
      top: 35%;
      transform: translateY(-50%);
      cursor: pointer;
    }
    .criterios {
      font-size: 0.9em;
      margin-top: 5px;
    }
    .criterios span {
      display: block;
      color: red;
    }
    .criterios span.valid {
      color: green;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <img src="{{ url_for('static', filename='img/logo_gervasi.png') }}" alt="Gervasi Logo" class="logo-login" />
    <h2>{{ t.restablecer }}</h2>

    {% if error %}
      <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST">
      <label for="nueva">{{ t.nueva_pass }}</label>
      <div class="password-container">
        <input type="password" id="nueva" name="nueva" required oninput="validarPassword()">
        <span class="toggle-password" onclick="togglePassword('nueva')">👁</span>
      </div>

      <div class="criterios" id="criterios"
            data-min="{{ t.criterios.min }}"
            data-mayus="{{ t.criterios.mayus }}"
            data-num="{{ t.criterios.num }}"
            data-esp="{{ t.criterios.esp }}">
        <span id="min">🔴 {{ t.criterios.min }}</span>
        <span id="mayus">🔴 {{ t.criterios.mayus }}</span>
        <span id="num">🔴 {{ t.criterios.num }}</span>
        <span id="esp">🔴 {{ t.criterios.esp }}</span>
        </div>


      <label for="confirmar">{{ t.confirmar_pass }}</label>
      <div class="password-container">
        <input type="password" id="confirmar" name="confirmar" required>
        <span class="toggle-password" onclick="togglePassword('confirmar')">👁</span>
      </div>

      <button type="submit">{{ t.restablecer }}</button>
    </form>

    <a href="/" class="btn-volver">{{ t.entrar or "Volver al login" }}</a>
  </div>

  <script>
    function togglePassword(id) {
      const input = document.getElementById(id);
      input.type = input.type === 'password' ? 'text' : 'password';
    }

    function validarPassword() {
      const pass = document.getElementById('nueva').value;

      toggleCriterio('min', pass.length >= 8);
      toggleCriterio('mayus', /[A-Z]/.test(pass));
      toggleCriterio('num', /[0-9]/.test(pass));
      toggleCriterio('esp', /[!@#$%^&*(),.?":{}|<>]/.test(pass));
    }

    function toggleCriterio(id, valido) {
        const span = document.getElementById(id);
        const texto = document.getElementById("criterios").dataset[id];
        span.classList.toggle("valid", valido);
        span.textContent = `${valido ? "🟢" : "🔴"} ${texto}`;
    }
  </script>
</body>
</html>
