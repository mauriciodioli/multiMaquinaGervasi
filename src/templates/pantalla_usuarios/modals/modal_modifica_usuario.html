<div id="modal-modificar-usuario" style="display:none;" class="modal fade">
  <div class="modal-dialog modal-lg">
    <form id="form-modificar-usuario">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">✏️ Modifica utente</h5>
          <button type="button" id="btn-cerrar-modal-modificar" class="btn-close">×</button>
        </div>
        <div class="modal-body">
          <input type="hidden" name="id" id="mod-id">

          <label for="mod-email" class="form-label">E-mail</label>
          <input type="email" class="form-control mb-2" name="correo_electronico" id="mod-email" required>

          <label for="mod-roll" class="form-label">Ruolo</label>
          <input type="text" class="form-control mb-2" name="roll" id="mod-roll">

          <label for="mod-activo" class="form-label">Stato</label>
          <select class="form-control mb-2" name="activo" id="mod-activo">
            <option value="1">&#9989; Risorsa</option> <!-- ✅ -->
            <option value="0">&#10060; Oziare</option> <!-- ❌ -->
          </select>
        </div>
         <div class="modal-footer" style="margin-top: 1rem;">
          <button type="submit" class="btn btn-success">Salva modifiche</button>
          <button type="button" id="btn-cancelar-modificar" class="btn btn-secondary">Cancellare</button>
        </div>
      </div>
    </form>
  </div>
</div>
