<div class="modal" id="modal-modificar-usuario">
  <div class="modal-dialog">
    <form id="form-modificar-usuario">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">✏️ Modificar Usuario</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" name="id" id="mod-id">
          <input type="email" class="form-control mb-2" name="correo_electronico" id="mod-email" required>
          <input type="text" class="form-control mb-2" name="roll" id="mod-roll">
          <select class="form-control mb-2" name="activo" id="mod-activo">
            <option value="1">Activo</option>
            <option value="0">Inactivo</option>
          </select>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-success">Guardar Cambios</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        </div>
      </div>
    </form>
  </div>
</div>
