on:
  push:
    branches:
      - main

name: deploy

env:
  DEPLOYMENT_VERSION: ms-multimaquina

jobs:
  deploy-to-cluster:
    runs-on: ubuntu-latest
    env:
      EC2_HOST: ec2-54-234-169-22.compute-1.amazonaws.com

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build and Push to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ github.repository_owner }}/msgervasi202505i:${{ github.sha }}
          build-args: |
            BUILD_VERSION=${{ github.sha }}
          # If your Docker Hub login is required by this action, add:
          # username: ${{ secrets.DOCKER_USERNAME }}
          # password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Stop and remove existing container
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker stop ${{ env.DEPLOYMENT_VERSION }} || true
            docker rm ${{ env.DEPLOYMENT_VERSION }} || true

      - name: Remove existing Docker image
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            IMAGE_ID=$(docker images -q ${{ github.repository_owner }}/msgervasi202505i || true)
            echo "IMAGE_ID is $IMAGE_ID"
            if [ -n "$IMAGE_ID" ]; then
              docker rmi $IMAGE_ID || true
            fi

      - name: Copy Docker image to AWS instance
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker pull docker.io/${{ github.repository_owner }}/msgervasi202505i:${{ github.sha }}
            docker run -d \
              --name ${{ env.DEPLOYMENT_VERSION }} \
              --network red_app \
              -p 5000:5000 \
              --restart always \
              docker.io/${{ github.repository_owner }}/msgervasi202505i:${{ github.sha }}

      - name: Wait until container is running
        run: |
          until docker ps -q --filter name=${{ env.DEPLOYMENT_VERSION }}; do
            echo "Waiting for container to start..."
            sleep 5
          done

      - name: Install vim and nano inside the container
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            CONTAINER_ID=$(docker ps -q --filter name=${{ env.DEPLOYMENT_VERSION }})
            docker exec "$CONTAINER_ID" bash -lc "apt-get update && apt-get install -y vim nano"