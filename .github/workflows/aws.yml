name: deploy
on:
  push:
    branches: [ main ]

##############################################################################
# VARIABLES GLOBALES
##############################################################################
env:
  DEPLOYMENT_VERSION: msgervasi202505i     # nombre del contenedor
  NGROK_HOST: 0.tcp.eu.ngrok.io            # <── host público de ngrok
  NGROK_PORT: "11639"                      # <── puerto público de ngrok
  SSH_USER: Administrator                  # usuario de Windows Server

jobs:
  deploy-to-cluster:
    if: github.actor != 'dependabot[bot]' && github.actor != 'dependabot-preview[bot]'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: true

    steps:
    # --------------------------------------------------------------------- #
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v1
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build & push image (if needed)
      run: |
        if ! docker pull ${{ secrets.DOCKER_USERNAME }}/msgervasi202505i:latest; then
          docker build -t ${{ secrets.DOCKER_USERNAME }}/msgervasi202505i:latest .
          docker push   ${{ secrets.DOCKER_USERNAME }}/msgervasi202505i:latest
        fi

    - name: Stop & remove existing container
      uses: appleboy/ssh-action@master
      with:
        host:     ${{ env.NGROK_HOST }}
        port:     ${{ env.NGROK_PORT }}
        username: ${{ env.SSH_USER }}
        key:      ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          docker stop ${{ env.DEPLOYMENT_VERSION }} || true
          docker rm   ${{ env.DEPLOYMENT_VERSION }} || true

    - name: Remove existing Docker image
      uses: appleboy/ssh-action@master
      with:
        host:     ${{ env.NGROK_HOST }}
        port:     ${{ env.NGROK_PORT }}
        username: ${{ env.SSH_USER }}
        key:      ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          IMAGE_ID=$(docker images -q ${{ secrets.DOCKER_USERNAME }}/msgervasi202505i)
          if [ -n "$IMAGE_ID" ]; then docker rmi $IMAGE_ID; fi

    - name: Pull & run new image
      uses: appleboy/ssh-action@master
      with:
        host:     ${{ env.NGROK_HOST }}
        port:     ${{ env.NGROK_PORT }}
        username: ${{ env.SSH_USER }}
        key:      ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          docker pull docker.io/${{ secrets.DOCKER_USERNAME }}/msgervasi202505i:latest
          docker run -d --name ${{ env.DEPLOYMENT_VERSION }} \
            -p 5002:5000 --restart always \
            docker.io/${{ secrets.DOCKER_USERNAME }}/msgervasi202505i:latest

    - name: Wait until container is running
      uses: appleboy/ssh-action@master
      with:
        host:     ${{ env.NGROK_HOST }}
        port:     ${{ env.NGROK_PORT }}
        username: ${{ env.SSH_USER }}
        key:      ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          until docker ps --filter "name=${{ env.DEPLOYMENT_VERSION }}" --format '{{.ID}}'; do
            echo "Esperando que el contenedor arranque…"; sleep 5
          done
