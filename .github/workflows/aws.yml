name: deploy
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/msgervasi202505i
  IMAGE_TAG: latest
  CONTAINER_NAME: msgervasi202505i
  HOST_PORT: "5002"
  EC2_HOST: ec2-44-223-20-210.compute-1.amazonaws.com

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22                 # cambia si usás otro
          script: |
            set -e
            echo ">> ❶ Traigo la imagen nueva"
            docker pull ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

            echo ">> ❷ Quito contenedor viejo (si existe)"
            docker stop ${{ env.CONTAINER_NAME }} || true
            docker rm   ${{ env.CONTAINER_NAME }} || true

            echo ">> ❸ Lanzo contenedor nuevo"
            docker run -d --name ${{ env.CONTAINER_NAME }} \
              -p ${{ env.HOST_PORT }}:5000 \
              --restart unless-stopped \
              ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

            echo ">> ❹ Verifico estado"
            docker ps --filter name=${{ env.CONTAINER_NAME }} --format '{{.Names}} → {{.Status}}'
