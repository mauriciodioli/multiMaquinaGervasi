name: deploy

on:
  push:
    branches:
      - main

env:
  DEPLOYMENT_VERSION: "msgervasi202505i"
  NGROK_HOST: 0.tcp.eu.ngrok.io
  NGROK_PORT: "11639"
  SSH_USER: Administrator

jobs:
  deploy-to-cluster:
    if: github.actor != 'dependabot[bot]' && github.actor != 'dependabot-preview[bot]'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Verify Changes are Checked Out
        run: |
          echo "Verifying changes..."
          ls -l

      - name: Set Dockerfile WORKDIR to /app
        run: |
          sed -i 's|WORKDIR .*|WORKDIR /app|' Dockerfile

      - name: Verify Dockerfile WORKDIR
        run: grep WORKDIR Dockerfile

      - name: Log in to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Verify Docker Hub Login
        run: docker info

      - name: Build and Push to Docker Hub (if needed)
        id: build_and_push
        run: |
          if ! docker pull ${{ secrets.DOCKER_USERNAME }}/msgervasi202505i:latest; then
            docker build -t ${{ secrets.DOCKER_USERNAME }}/msgervasi202505i:latest .
            docker push ${{ secrets.DOCKER_USERNAME }}/msgervasi202505i:latest
          else
            echo "✅ La imagen ya existe en Docker Hub."
          fi

      - name: Stop & remove existing container
        uses: appleboy/ssh-action@master
        with:
          host:     ${{ env.NGROK_HOST }}
          port:     ${{ env.NGROK_PORT }}
          username: ${{ env.SSH_USER }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          shell:    powershell    
          script: |
            docker stop ${{ env.DEPLOYMENT_VERSION }} || echo "No se pudo detener (no existe?)"
            docker rm   ${{ env.DEPLOYMENT_VERSION }} || echo "No se pudo eliminar (no existe?)"

      - name: Remove existing Docker image
        uses: appleboy/ssh-action@master
        with:
          host:     ${{ env.NGROK_HOST }}
          port:     ${{ env.NGROK_PORT }}
          username: ${{ env.SSH_USER }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          shell:    powershell    
          script: |
            IMAGE_ID=$(docker images -q ${{ secrets.DOCKER_USERNAME }}/msgervasi202505i)
            if [ -n "$IMAGE_ID" ]; then
              docker rmi $IMAGE_ID
            else
              echo "❌ Imagen no encontrada localmente"
            fi

      - name: Pull & run new image
        uses: appleboy/ssh-action@master
        with:
          host:     ${{ env.NGROK_HOST }}
          port:     ${{ env.NGROK_PORT }}
          username: ${{ env.SSH_USER }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker pull docker.io/${{ secrets.DOCKER_USERNAME }}/msgervasi202505i:latest
            docker run -d --name ${{ env.DEPLOYMENT_VERSION }} \
              -p 5002:5000 --restart always \
              docker.io/${{ secrets.DOCKER_USERNAME }}/msgervasi202505i:latest

      - name: Wait until container is running
        uses: appleboy/ssh-action@master
        with:
          host:     ${{ env.NGROK_HOST }}
          port:     ${{ env.NGROK_PORT }}
          username: ${{ env.SSH_USER }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          shell:    powershell    
          script: |
            echo "Esperando que el contenedor esté activo..."
            for i in {1..10}; do
              if docker ps --filter "name=${{ env.DEPLOYMENT_VERSION }}" --format '{{.ID}}' | grep .; then
                echo "✅ Contenedor iniciado."
                exit 0
              fi
              echo "⏳ Esperando..."
              sleep 5
            done
            echo "❌ Timeout esperando el contenedor"
            exit 1
