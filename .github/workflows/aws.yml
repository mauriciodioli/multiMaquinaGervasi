name: deploy

on:
  push:
    branches: [ "main" ]         # cada push a main
  workflow_dispatch:             # ejecución manual opcional

env:           # valores globales
  IMAGE_NAME: mauriciodioli/msgervasi202505i
  IMAGE_TAG: latest              # cámbialo si versionás
  CONTAINER_NAME: msgervasi202505i
  HOST_PORT: "5002"              # 5002 externo → 5000 interno
  EC2_HOST: ec2-44-223-20-210.compute-1.amazonaws.com

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (always)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: true

    steps:
      - name: Pull & restart on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}          # tu clave privada
          script: |
            echo "== ❶  Actualizar imagen"
            docker pull ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

            echo "== ❷  Detener/eliminar contenedor viejo (si existe)"
            docker stop ${{ env.CONTAINER_NAME }} || true
            docker rm   ${{ env.CONTAINER_NAME }} || true

            echo "== ❸  Lanzar contenedor nuevo"
            docker run -d --name ${{ env.CONTAINER_NAME }} \
              -p ${{ env.HOST_PORT }}:5000 \
              --restart unless-stopped \
              ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

            echo "== ❹  Contenedores activos"
            docker ps --format '{{.Names}} → {{.Status}}'

      - name: Wait until container listens
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          script: |
            echo "Esperando a que el servicio responda en el puerto ${{ env.HOST_PORT }}..."
            for i in {1..12}; do
              if curl -s http://localhost:${{ env.HOST_PORT }}/ >/dev/null 2>&1 ; then
                echo "✔️  Contenedor activo"
                exit 0
              fi
              echo "⏳  $i/12: aún sin respuesta..."
              sleep 5
            done
            echo "❌  El contenedor no respondió a tiempo"
            exit 1
