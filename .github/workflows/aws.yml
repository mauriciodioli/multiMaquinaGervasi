name: deploy-windows

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  IMAGE_NAME: mauriciodioli/msgervasi202505i
  IMAGE_TAG: latest
  CONTAINER_NAME: msgervasi202505i
  HOST_PORT: "8080"       # 8080 → 5000 dentro del contenedor
  SSH_PORT: "22"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on Windows Server 2022
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}          # 192.168.1.3
          port: ${{ env.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}      # Administrator
          key: ${{ secrets.SSH_KEY }}            # tu id_github
          script: |
            REM ========== ❶ Traer la imagen ==========
            docker pull ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

            REM ========== ❷ Parar / borrar contenedor viejo ==========
            docker stop  ${{ env.CONTAINER_NAME }}  || echo no container
            docker rm    ${{ env.CONTAINER_NAME }}  || echo no container

            REM ========== ❸ Ejecutar contenedor nuevo ==========
            docker run -d --name ${{ env.CONTAINER_NAME }} ^
              -p ${{ env.HOST_PORT }}:5000 ^
              --restart unless-stopped ^
              ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

            REM ========== ❹ Mostrar estado ==========
            docker ps --filter name=${{ env.CONTAINER_NAME }} --format "{{.Names}} — {{.Status}}"
