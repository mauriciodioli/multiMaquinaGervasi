name: deploy

on:
  push:
    branches:
      - main

env:
  DEPLOYMENT_VERSION: "msgervasi202505i"     # nombre del contenedor
  NGROK_HOST: 6.tcp.eu.ngrok.io              # ← el host que te dio ngrok
  NGROK_PORT: "18253"                        # ← el puerto TCP
  SSH_USER: multimaquina                     # ← tu usuario en Ubuntu-WSL (NO Administrator)

jobs:
  deploy-to-cluster:
    if: github.actor != 'dependabot[bot]' && github.actor != 'dependabot-preview[bot]'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Verify Changes are Checked Out
        run: |
          echo "Verifying changes..."
          ls -l

      - name: Set Dockerfile WORKDIR to /app
        run: |
          sed -i 's|WORKDIR .*|WORKDIR /app|' Dockerfile

      - name: Verify Dockerfile WORKDIR
        run: grep WORKDIR Dockerfile

      - name: Log in to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Verify Docker Hub Login
        run: docker info

      - name: Build and Push to Docker Hub (if needed)
        id: build_and_push
        run: |
          if ! docker pull ${{ secrets.DOCKER_USERNAME }}/msgervasi202505i:latest; then
            docker build -t ${{ secrets.DOCKER_USERNAME }}/msgervasi202505i:latest .
            docker push ${{ secrets.DOCKER_USERNAME }}/msgervasi202505i:latest
          else
            echo "✅ La imagen ya existe en Docker Hub."
          fi
      - name: Test raw SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # Añade tu host-ngrok a known_hosts para que no falle la autenticación de clave
          ssh-keyscan -p ${{ secrets.NGROK_PORT }} ${{ secrets.NGROK_HOST }} >> ~/.ssh/known_hosts

          # Intento de login “a pelo”
          ssh -vvv -o StrictHostKeyChecking=yes -i ~/.ssh/id_rsa \
              -p ${{ secrets.NGROK_PORT }} \
              ${{ secrets.SSH_USER }}@${{ secrets.NGROK_HOST }} \
              echo "OK desde runner"





      - name: Stop & remove existing container
        uses: appleboy/ssh-action@master
        with:
          host:     ${{ env.NGROK_HOST }}
          port:     ${{ env.NGROK_PORT }}
          username: ${{ env.SSH_USER }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            powershell -Command "
              try {
                docker stop '${{ env.DEPLOYMENT_VERSION }}' | Out-Null
                Write-Host 'Contenedor detenido'
              } catch {
                Write-Host 'No se pudo detener (no existe?)'
              }

              try {
                docker rm '${{ env.DEPLOYMENT_VERSION }}' | Out-Null
                Write-Host 'Contenedor eliminado'
              } catch {
                Write-Host 'No se pudo eliminar (no existe?)'
              }
            "

      - name: Remove existing Docker image
        uses: appleboy/ssh-action@master
        with:
          host:     ${{ env.NGROK_HOST }}
          port:     ${{ env.NGROK_PORT }}
          username: ${{ env.SSH_USER }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            powershell -Command "
              \$image = docker images -q ${{ secrets.DOCKER_USERNAME }}/msgervasi202505i
              if (\$image) { docker rmi \$image }
            "

      - name: Pull & run new image
        uses: appleboy/ssh-action@master
        with:
          host:     ${{ env.NGROK_HOST }}
          port:     ${{ env.NGROK_PORT }}
          username: ${{ env.SSH_USER }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            powershell -Command "
              docker pull docker.io/${{ secrets.DOCKER_USERNAME }}/msgervasi202505i:latest

              docker run -d `
                --name '${{ env.DEPLOYMENT_VERSION }}' `
                -p 5002:5000 `
                --restart always `
                docker.io/${{ secrets.DOCKER_USERNAME }}/msgervasi202505i:latest
            "

      - name: Wait until container is running
        uses: appleboy/ssh-action@master
        with:
          host:     ${{ env.NGROK_HOST }}
          port:     ${{ env.NGROK_PORT }}
          username: ${{ env.SSH_USER }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            powershell -Command "
              Write-Host '⏳ Esperando que el contenedor esté activo…'
              for ($i = 1; $i -le 10; $i++) {
                if (docker ps --filter \"name=${{ env.DEPLOYMENT_VERSION }}\" --format '{{.ID}}') {
                  Write-Host '✅ Contenedor iniciado.'; exit 0
                }
                Start-Sleep -Seconds 5
              }
              Write-Error '❌ Timeout esperando el contenedor'; exit 1
            "
